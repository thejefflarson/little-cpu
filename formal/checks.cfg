[options]
# The insn_c_* checks this generates exercise rtl/decoder.v's compressed decode on its
# own: imem_data is a free value every cycle here, so no fetch window is involved.
isa rv32imc
solver btormc

[csrs]
# A name here generates that CSR's csrw_* check.
mcycle   inc upcnt
minstret inc upcnt
mscratch any

#omit bus_imem_ch0                [DESIGN] formal/imemcheck.sv holds this against the real fetch ports
#omit bus_imem_fault_ch0          [BLOCKED] the fetch bus refuses now, so what is left is RISCV_FORMAL_BUS: nine rvfi_bus_* outputs to drive and to re-prove unread
#omit bus_dmem_ch0                [DESIGN] formal/dmemcheck.sv holds this against the real data port
#omit bus_dmem_fault_ch0          [DESIGN] no fault line on the data bus: causes 5 and 7 are raised off range answers that arrive with the address, and fault_ch0 grades that refusal
#omit bus_dmem_io_read_ch0        [BLOCKED] needs RISCV_FORMAL_BUS and rvformal_addr_io; no MMIO region exists
#omit bus_dmem_io_read_fault_ch0  [DESIGN] the data bus half of bus_dmem_fault_ch0's grounds, and it needs rvformal_addr_io as well
#omit bus_dmem_io_write_ch0       [BLOCKED] needs RISCV_FORMAL_BUS and rvformal_addr_io; no MMIO region exists
#omit bus_dmem_io_write_fault_ch0 [DESIGN] the data bus half of bus_dmem_fault_ch0's grounds, and it needs rvformal_addr_io as well
#omit bus_dmem_io_order_ch0       [BLOCKED] on the core, not the memory: one access is outstanding at a time, so there is nothing to order
#omit causal_io_ch0               [BLOCKED] needs rvformal_addr_io; no MMIO region exists
#omit csrc_inc_mcycle_ch0         [DESIGN] rvfi_csrc_inc_check.sv is red on a CORRECT core here; measured, see [csrs]
#omit csrc_inc_minstret_ch0       [DESIGN] rvfi_csrc_inc_check.sv is red on a CORRECT core here; measured, see [csrs]
#omit cover                       [DESIGN] run standalone by formal/cover.sby with this repo's own five goals

[depth]
#derive F 6  worst-case first retire, swept out of `hang`
#derive G 6  worst-case gap between two retires, swept out of `liveness`
#floor insn       F+2G         one retire, assume(valid) at the check cycle, every assertion about it
#floor fault      F+2G         insn's shape exactly, so insn's floor and insn's number
#floor ill        F+2G         insn's shape too: one channel, assume(valid && insn == 0), assertions about that retire
#floor csrw       F+2G         insn's shape, over a CSR instruction rather than an ISA-table one
#floor reg        F+G,start+G  two retires: the write is shadowed from the start cycle and read back at the check cycle
#floor pc_fwd     F+G,start+G  two retires, the predecessor's pc_wdata shadowed from the start cycle
#floor pc_bwd     F+G,start+G  pc_fwd's shape, in the other direction
#floor causal     F+G,start+G  two retires: the later reader is found in the window and the writer asserts at the check cycle
#floor causal_mem F+G,start+G  causal's shape, over a memory address rather than a register
#floor liveness   F+G,trig+G   the retire assumed at trig and its successor, which has to fall inside the window
#floor unique     F+G,trig+G   liveness's shape: two retires, one window
#floor hang       F+1          the first retire alone, asserted on a registered flag
#floor csrc_upcnt 9            measured, not derived -- see the paragraph below
#floor csrc_any   9            measured, not derived -- see the paragraph below
insn           19
fault          19
reg      15    22
pc_fwd   10    30
pc_bwd   10    30
liveness 1  10 30
unique   1  10 30
causal   10    20
causal_mem 10  20
hang     1     30
ill            19
csrw           30
csrc_upcnt 1   15
csrc_any   1   15

[script-sources]
read_verilog -sv @basedir@/../arbiter.v
read_verilog -sv @basedir@/../wrapper.v
read_verilog -sv @basedir@/../../rtl/structs.v
read_verilog -sv @basedir@/../../rtl/fetcher.v
read_verilog -sv @basedir@/../../rtl/regfile.v
read_verilog -sv @basedir@/../../rtl/csrs.v
read_verilog -sv @basedir@/../../rtl/decoder.v
read_verilog -sv @basedir@/../../rtl/regsel.v
read_verilog -sv @basedir@/../../rtl/executor.v
read_verilog -sv @basedir@/../../rtl/accessor.v
read_verilog -sv @basedir@/../../rtl/writeback.v
read_verilog -sv @basedir@/../../rtl/littlecpu.v

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS
`define RISCV_FORMAL_MEM_FAULT
`define RISCV_FORMAL_CSR_MCAUSE

[defines liveness]
`define RISCV_FAIRNESS
