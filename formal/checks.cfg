[options]
# The insn_c_* checks this generates exercise rtl/decoder.v's compressed decode
# on its own: imem_data is a free value every cycle here, so no fetch window is
# involved. The .S suite is what covers the two together.
isa rv32imc
# `solver` selects genchecks' engine, not just an SMT solver name: `bmc3` means
# `abc bmc3`, `btormc` means `btor btormc`, anything else means `smtbmc <that>`.
# Keep btormc -- reg_ch0 is one query that did not converge under `smtbmc yices`
# in over 20 minutes and returns in 8-12s here.
solver btormc

[csrs]
# A name here generates that CSR's csrw_* check. A name followed by a test list
# also generates one csrc_<test>_<name> check per spelling, which is the only
# way upstream's rvfi_csrc_{any,const,hpm,inc,upcnt,zero}_check.sv models are
# reachable at all.
#
# This is not the set of CSRs the core implements. It is the subset
# rvfi_csrw_check.sv can say something true about. Adding a WARL CSR (mtvec,
# mepc, mcause, mstatus) or a read-only-zero one (mie, mip, mtval) puts a FAIL on
# a correct core: that check has no WARL model, it asserts that every bit the
# instruction offered appears set in what landed, and masked bits do not land.
# Those are checked field by field in test/csr_tb.v instead.
#
# A name here also makes the generated rvfi_macros.vh declare
# rvfi_csr_<name>_{rmask,wmask,rdata,wdata}, which formal/wrapper.v connects to
# littlecpu. Adding a CSR is therefore new `ifdef RISCV_FORMAL` output in
# rtl/csrs.v -- which exports shadows for these three and no others -- plus a
# re-run of `make -C formal nonperturbation`.
#
# `inc` is spelled here with no `csrc_inc` line in [depth] on purpose: that is
# what makes genchecks consider and drop those two checks, which is what their
# `#omit` lines below then have to declare. Delete the word and the decline
# becomes prose only. rvfi_csrc_inc_check.sv is red on a correct core here: it
# clears `csr_written` every non-check cycle, so its post-write fallback lives
# one cycle, and CSR serialization means two CSR retires are never adjacent.
# Measured PASS at 6..12, red at 13..16; no depth escapes it.
#
# `upcnt` says the counter strictly increases between two reads, with writes
# assumed away. It does not say minstret advances by exactly the non-trapping
# issues, so test/asm/minstret.S and test/csr_tb.v still carry that half.
mcycle   inc upcnt
minstret inc upcnt
mscratch any

# [depth] below is the list of checks that EXIST, not a tuning table. Both of
# genchecks' call sites return early on a check with no depth line, so such a
# check is not generated at all -- no .sby, no directory, no status, no warning,
# exit 0. It is then missing from the results and from formal/EXPECTED_FAIL at
# once, and set equality reports a clean match on the smaller set.
#
# So the declined set is declared rather than described. Each `#omit` line names
# one check genchecks considered and skipped, with its reason.
# formal/genchecks-audit.py traces the generator's own get_depth_cfg calls and
# compares everything it dropped against these lines in both directions, so a
# check upstream adds at the next pin bump fails generation until someone rules
# on it. genchecks' cfg parser drops `#` lines, so none of this perturbs
# generation. The tag is free-form to that script, which reads only the name.
#
#   [BLOCKED]  the property is wanted and there is no hardware here to state it
#              about.
#   [DESIGN]   declined on the merits; no hardware change reopens it.
#
# THE FETCH BUS CAN REFUSE AND THE DATA BUS CANNOT, and that split is what the
# five rulings below turn on. rtl/imemory.v reports a fetch outside the text
# window on `imem_fault`, which decode raises as an instruction access fault, so
# `fault_ch0` is generated (a depth of its own is below) and covers the arm that
# check calls `ifault`. A load or a store outside every window is still answered
# silently -- both memories read zero and drop the write -- because the
# decode-time region test that would fault it was built and measured at four
# extra logic levels in the fetch loop and 10.57-11.00 MHz over four seeds,
# against a 12.00 MHz requirement.
#omit bus_imem_ch0                [DESIGN] formal/imemcheck.sv holds this against the real fetch ports
#omit bus_imem_fault_ch0          [BLOCKED] the fetch bus refuses now, so what is left is RISCV_FORMAL_BUS: nine rvfi_bus_* outputs to drive and to re-prove unread
#omit bus_dmem_ch0                [DESIGN] formal/dmemcheck.sv holds this against the real data port
#omit bus_dmem_fault_ch0          [DESIGN] no fault line on the data bus; an out-of-range load reads zero and an out-of-range store is dropped
#omit bus_dmem_io_read_ch0        [BLOCKED] needs RISCV_FORMAL_BUS and rvformal_addr_io; no MMIO region exists
#omit bus_dmem_io_read_fault_ch0  [DESIGN] the data bus half of bus_dmem_fault_ch0's grounds, and it needs rvformal_addr_io as well
#omit bus_dmem_io_write_ch0       [BLOCKED] needs RISCV_FORMAL_BUS and rvformal_addr_io; no MMIO region exists
#omit bus_dmem_io_write_fault_ch0 [DESIGN] the data bus half of bus_dmem_fault_ch0's grounds, and it needs rvformal_addr_io as well
#omit bus_dmem_io_order_ch0       [BLOCKED] on the core, not the memory: one access is outstanding at a time, so there is nothing to order
#omit causal_io_ch0               [BLOCKED] needs rvformal_addr_io; no MMIO region exists
#omit csrc_inc_mcycle_ch0         [DESIGN] rvfi_csrc_inc_check.sv is red on a CORRECT core here; measured, see [csrs]
#omit csrc_inc_minstret_ch0       [DESIGN] rvfi_csrc_inc_check.sv is red on a CORRECT core here; measured, see [csrs]
#omit cover                       [DESIGN] run standalone by formal/cover.sby with this repo's own five goals

[depth]
# Depths are derived, not inherited, from two figures the checks measure about
# themselves in seconds each:
#
#   F = 6   worst-case first retire. Sweep `hang`'s check cycle: red at 4, 5 and
#           6, PASS at 7 -- rvfi_hang_check.sv asserts on a registered flag, so
#           the flip point is F + 1.
#   G = 5   worst-case gap between two retires. Sweep `liveness`'s trig-to-check
#           distance: red at 3 and 4, PASS at 5, at trig 10 and again at trig 15.
#           The gap-4 counterexample is also this measurement's non-vacuity
#           witness, since rvfi_liveness_check.sv opens with
#           `assume(rvfi_valid)` at its trig cycle.
#
# G was 6 while a load spent a cycle in the accessor waiting for memory. The bus
# transaction now goes out from the executor's own cycle, so nothing waits there
# and the worst gap is one shorter. F is set by the first retire out of reset,
# which no load is part of, and did not move.
#
# To re-measure: copy this file with only the `hang` (or `liveness`) line in
# [depth], run `python3 genchecks-local.py <copy>`, and sweep the last column.
# Any change that adds a stall reason, lengthens a stage or widens the
# scoreboard past its three fixed slots has to do that before it lands.
#
# Both numbers hold with the machine timer interrupt in the core, because every
# harness here ties the interrupt input off -- formal/INTERRUPT_TIE_OFF declares
# that and formal/check-interrupt-tie-off.py enforces it. Both flip points above
# were taken under the tie-off. An interrupt costs a cycle that would otherwise
# have issued, so a free input there would move G and every depth built on it. The
# table is checked against the single hop F + G = 11 and the two hops
# F + 2G = 16. `insn 19` clears 16 by three and `reg 15 22` by six; both cleared
# the old F + 2G = 18 by one, so every depth below is further above its floor
# than it was and none of them moves. Depths move only on evidence, and a
# shorter derived floor is not evidence for cutting one.
#
# The first column is RISCV_FORMAL_RESET_CYCLES, which checks/rvfi_testbench.sv
# wires to the CHECKER's shadow state only; the DUT is held in reset for cycle 0
# regardless. So a two-column check has to clear G over its depth-minus-start
# window, not F + G, and `reg 15 22` is a window of 7 against G = 5 rather than
# something vacuous.
#
# `fault` takes `insn`'s number because it has `insn`'s shape, not because 19 is
# a round figure: one channel, `assume(valid)` at the check cycle, and every
# assertion about that one retire. So the same floor applies -- F + 2G = 16, the
# two hops that let the retire under test be a third rather than the first out of
# reset -- and 19 clears it by the same three. Sharing the number also means the
# two move together when F or G moves.
#
# ITS OWN COUNTEREXAMPLES ARE REACHABLE MUCH SHALLOWER THAN THAT, and the depth
# is the derivation rather than a measured need. Probe: report the read half of
# the fault mask on a fetch fault (`rvfi_mem_fault_rmask = {4{mem_fault}}` in
# rtl/writeback.v), which makes the check read an instruction fault as a load
# fault and assert `insn != 0` against a word that is zero. Swept 19 down to 1,
# it is FAIL at every depth -- a fetch fault is reachable on the first retire out
# of reset, so nothing here needs the two hops. The number is kept at `insn`'s
# because a shallower one would stop asking about later retires for no measured
# reason.
#
# csrc_upcnt and csrc_any are the only two-retire checks here, and F and G do not
# bound them: they shadow a value from one retire of a CSR instruction naming the
# CSR under test and assert against a second, and CSR instructions serialize.
# Their floor is measured at 9 -- three one-line mutations of rtl/csrs.v each
# PASS at 6..8 and go red at 9..16 -- and 15 clears it.
#
# A depth below its floor does not fail; it goes green having stopped asking.
# The probe for the 70 insn_* checks: delete rtl/executor.v's `rs2[4:0]` shift
# masking and insn_sll_ch0/insn_srl_ch0/insn_sra_ch0 each report a
# counterexample at the depth below. Sweep `insn` down on that same mutation and
# the counterexample survives to 5 and disappears at 4, where no instruction can
# retire and `assume(rvfi_valid && spec_valid)` is unsatisfiable. Reach for it
# before believing any insn_* result taken under a changed configuration. The
# three csrc_* checks have one-line probes of their own:
# `assign mcycle_plus = mcycle;`, `assign minstret_plus = minstret;`, and
# deleting `MSCRATCH: mscratch <= warl;` from rtl/csrs.v.
#
# Depths move only on evidence, in either direction, and there is no per-check
# wall bound -- the only budget is the `formal` job's `timeout-minutes: 20`, so a
# raised depth that stops converging takes the hand-authored tasks down with it.
#
# All of the above assumes RISCV_FORMAL_ALTOPS (see [defines]). Without it the
# real divider holds executor_out.valid for 32 cycles, F becomes ~37 and G ~36,
# and every number here must be re-derived.
insn           19
fault          19
reg      15    22
pc_fwd   10    30
pc_bwd   10    30
liveness 1  10 30
unique   1  10 30
causal   10    20
causal_mem 10  20
hang     1     30
ill            19
csrw           30
csrc_upcnt 1   15
csrc_any   1   15

[script-sources]
read_verilog -sv @basedir@/../arbiter.v
read_verilog -sv @basedir@/../wrapper.v
read_verilog -sv @basedir@/../../rtl/structs.v
read_verilog -sv @basedir@/../../rtl/fetcher.v
read_verilog -sv @basedir@/../../rtl/regfile.v
read_verilog -sv @basedir@/../../rtl/csrs.v
read_verilog -sv @basedir@/../../rtl/decoder.v
read_verilog -sv @basedir@/../../rtl/regsel.v
read_verilog -sv @basedir@/../../rtl/executor.v
read_verilog -sv @basedir@/../../rtl/accessor.v
read_verilog -sv @basedir@/../../rtl/writeback.v
read_verilog -sv @basedir@/../../rtl/littlecpu.v

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS
# Declares rvfi_mem_fault and its two masks. Without it those three signals do
# not exist in the macro set at all and `fault_ch0` cannot be generated, whatever
# its depth line says.
`define RISCV_FORMAL_MEM_FAULT
# mcause is deliberately NOT in [csrs] above, and this is not that: a name there
# generates csrw_mcause_ch0, which has no WARL model and would fail a correct
# core. This define only declares the four rvfi_csr_mcause_* signals, which
# rtl/csrs.v exports under the same macro. It is REQUIRED, not optional:
# checks/rvfi_fault_check.sv at the pin puts its whole mcause block behind this
# `ifdef` and leaves a dangling `else` behind when it is absent, so the check does
# not parse without it -- measured, `ERROR rc=16` with a syntax error at line 96.
`define RISCV_FORMAL_CSR_MCAUSE

[defines liveness]
`define RISCV_FAIRNESS
