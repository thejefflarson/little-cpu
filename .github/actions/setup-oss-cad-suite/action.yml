name: Set up the pinned OSS CAD Suite
description: >-
  Fetches and SHA-256-verifies the OSS CAD Suite release pinned in mk/oss-cad-pin.mk
  (`make cad-setup`) and puts its yosys, iverilog, sby, nextpnr and icetime on PATH,
  caching the tarball by the pin -- release, asset name and digest. The runner image's
  own copy at /opt/oss-cad-suite is never used: it moves with the image, and the pin
  is what says which toolchain a number came from.
runs:
  using: composite
  steps:
    - name: Resolve the OSS CAD Suite pin and the directory the fetch is cached in
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        make --no-print-directory cad-pin > "$RUNNER_TEMP/oss-cad-pin.txt"
        cat "$RUNNER_TEMP/oss-cad-pin.txt"
        grep -E '^(key|path|dir|tag)=' "$RUNNER_TEMP/oss-cad-pin.txt" >> "$GITHUB_OUTPUT"

    - name: Restore the pinned OSS CAD Suite tarball
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pin.outputs.path }}/oss-cad-suite-*.tgz
        key: ${{ steps.pin.outputs.key }}

    - name: make cad-setup
      shell: bash
      run: make cad-setup

    - name: Add the pinned OSS CAD Suite to PATH
      shell: bash
      env:
        SUITE_DIR: ${{ steps.pin.outputs.dir }}
        SUITE_TAG: ${{ steps.pin.outputs.tag }}
      run: |
        set -euo pipefail
        echo "$SUITE_DIR/bin" >> "$GITHUB_PATH"
        echo "$SUITE_DIR/py3bin" >> "$GITHUB_PATH"
        {
          echo "### OSS CAD Suite"
          echo "- pinned release: $SUITE_TAG (mk/oss-cad-pin.mk)"
          echo "- yosys: \`$("$SUITE_DIR/bin/yosys" -V)\`"
        } >> "$GITHUB_STEP_SUMMARY"
