name: Formal Nightly

# The nightly ladder: the full genchecks-local.py sweep (insn_*/reg/pc_fwd/
# pc_bwd/liveness/unique/causal/csrw), the hand-authored imemcheck/dmemcheck/
# cover tasks and the depth-50 whole-ISA `complete` walk. (equiv.sh used to
# run here too; ADR-0047 deleted it and its step together -- the replacement,
# `make -C formal nonperturbation`, takes nine seconds and lives on the PR
# gate.) None of this gates merges: there is no required-status-check
# entry for this workflow, unlike ci.yml's elaborate/test/components/
# monitor-freshness/lint.
#
# This is no longer the only place the genchecks sweep runs, and the reason
# it used to be has expired. This header used to open by citing ADR-0006's
# estimate of ~75 checks at depth 15-30 as "1-3h wall with -j, not something
# the PR gate (ci.yml) can afford to run on every push". That estimate
# predates ADR-0024's engine switch: ADR-0025 measures the sweep at 4m05s
# wall with -j6 at the depths checks.cfg actually configures. A cost claim
# nothing re-measures is how a workflow keeps a boundary it no longer needs,
# so it is recorded here as superseded rather than quietly deleted.
#
# ci.yml's `formal` job therefore runs the same `make -C formal check` on
# every pull request and gates on the same formal/check-baseline.sh
# comparison -- because an edit to formal/EXPECTED_FAIL that this workflow
# contradicts the next morning is a baseline edit that merged unverified.
# Keep the two ladder invocations identical: both call the same Makefile
# target against the same two baseline files, on purpose, so the nightly
# cannot start grading a different ladder than the gate. What stays here is
# what the gate genuinely cannot afford -- `complete` below -- plus the
# budget for anything whose runtime is unbounded. ADR-0025's
# addendum is the live one to watch: CSR serialization pushed the two-hop
# figure to ~15, so `insn 15` now sits on its floor with no margin, and a
# depth bump re-opens the PR gate's budget question along with it.
#
# ADR-0022: the ladder step reports against the explicit baseline in
# formal/EXPECTED_FAIL (set equality in both directions, formal/
# check-baseline.sh, same contract as test/EXPECTED_FAIL / ADR-0014) rather
# than a blanket `|| true`. That comparison step's exit status is the job's
# real signal; `complete` is a documented expected-to-fail (ADR-0023) and is
# `continue-on-error` so it reports honestly without drowning that signal in
# a job that is red every single night for a reason nobody has to read the
# summary to already know. There used to be a second such step, equiv.sh,
# and ADR-0047 is the reason there is not: a check parked behind
# `continue-on-error` that has never once produced a verdict is
# indistinguishable from a working control, and this is precisely the place
# that indistinguishability hides.
#
# ADR-0024: the ladder step's own wall time is no longer dominated by
# `reg_ch0` sitting in a solver for up to its 1800s bound. `formal/
# checks.cfg`'s `engine` option (a formal/genchecks-local.py local-fork
# addition) is what picks the BMC engine now, not this workflow -- switching
# it, or overriding it for one check via checks.cfg's `[engine]` section,
# needs no change here. See ADR-0024 for the measured before/after.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  OSS_CAD_SUITE_TAG: "2026-06-29"
  OSS_CAD_SUITE_FILE: "oss-cad-suite-linux-x64-20260629.tgz"
  OSS_CAD_SUITE_SHA256: "dfb5df3c28599081d2baca13884c069c025b1990c86e90f4a4d84aadcd255cc5"

jobs:
  ladder:
    name: riscv-formal ladder
    runs-on: little-cpu-runners
    timeout-minutes: 300
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite
        with:
          tag: ${{ env.OSS_CAD_SUITE_TAG }}
          file: ${{ env.OSS_CAD_SUITE_FILE }}
          sha256: ${{ env.OSS_CAD_SUITE_SHA256 }}

      # genchecks-local.py's insn_*/reg/pc_fwd/pc_bwd/liveness/unique/
      # causal/csrw sweep (formal/checks.cfg), now with `-k` (formal/
      # Makefile) so the whole 79-check ladder actually runs instead of
      # stopping at the first failure (ADR-0022). `continue-on-error`, not
      # `|| true`: the step's real per-check outcome (and this run's own
      # nonzero `make` exit, since formal/EXPECTED_FAIL is non-empty until
      # M2/M3 land) stays visible in the job UI instead of being laundered
      # into an unconditional success; the "Compare" step below is the
      # step whose exit status is the job's actual signal.
      - name: riscv-formal ladder (make -C formal check)
        continue-on-error: true
        run: make -C formal check

      # The real signal, and it is now TWO set-equalities, both in both
      # directions (ADR-0022, ADR-0014's contract):
      #
      #   formal/EXPECTED_FAIL   which checks are red. An unexpected *pass*
      #                          (e.g. the C.JR fix landing) trips this as
      #                          loudly as a new failure.
      #   formal/EXPECTED_CHECKS which checks EXIST. Without it a lost
      #                          formal/checks.cfg [depth] line silently
      #                          shrinks the ladder and the remaining checks
      #                          still match the baseline exactly -- a green
      #                          nightly over less coverage than it claims
      #                          (ADR-0033, gap 1).
      #
      # check-baseline.sh defaults its third argument to the EXPECTED_CHECKS
      # beside it, so the invocation below is unchanged. Not
      # `continue-on-error` -- this exit status is the job's.
      #
      # NO PIPE ON THE GRADED COMMAND, DELIBERATELY, and this step did have
      # one until now, which meant it could not fail. The comment it replaces
      # asserted that "`-e`/`pipefail` are both on by default for GH Actions
      # bash steps". Half right, and the wrong half: without an explicit
      # `shell:` key a `run:` step is `bash -e {0}` -- errexit only. Only an
      # explicit `shell: bash` gets `-eo pipefail`. So `$?` after
      # `check-baseline.sh | tee ...` was tee's status, which is always 0,
      # and this step reported success no matter what the comparison found.
      # Demonstrated on a scratch branch against ci.yml's copy of the same
      # step: a deliberately wrong formal/EXPECTED_FAIL printed "Failure list
      # does NOT match" and the job still went green.
      #
      # That is worth stating plainly, because it means the guarantee
      # ADR-0022 records -- "that comparison step's exit status is the job's
      # real signal" -- has never actually held. Replacing `|| true` with
      # this step moved the defect rather than fixing it: the nightly still
      # could not go red. Redirect to a file, capture the status off the
      # unpiped command, then publish.
      - name: Compare ladder results against formal/EXPECTED_{FAIL,CHECKS}
        run: |
          set +e
          formal/check-baseline.sh formal/checks formal/EXPECTED_FAIL \
            > "$RUNNER_TEMP/baseline-report.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/baseline-report.txt"
          {
            echo "### formal ladder vs formal/EXPECTED_FAIL"
            echo '```'
            cat "$RUNNER_TEMP/baseline-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Summarize checks
        if: always()
        run: |
          {
            echo "### formal ladder (raw)"
            echo '```'
            for d in formal/checks/*/; do
              name=$(basename "$d")
              status=$(cat "$d/status" 2>/dev/null || echo "no status")
              echo "$name: $status"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: imemcheck / dmemcheck / cover
        if: always()
        run: |
          make -C formal imemcheck
          make -C formal dmemcheck
          make -C formal cover

      # depth-50 whole-ISA BMC walk (ADR-0006's "finish complete.sv" item).
      # Not part of the PR-gate acceptance criteria; run here because it is
      # exactly the nightly-scale check this workflow exists for. Not on the
      # formal/EXPECTED_FAIL ladder (that baseline is the genchecks-local.py
      # sweep only) -- `continue-on-error` per ADR-0022's "clearly-separated
      # reporting section" so it reports its real status without dragging the
      # whole job to permanent red every night for a reason already on file.
      - name: complete (whole-ISA BMC)
        if: always()
        continue-on-error: true
        id: complete
        run: make -C formal complete

      - name: Summarize complete
        if: always()
        run: |
          {
            echo "### complete (ADR-0023 -- expected-to-fail, non-gating)"
            echo "complete: ${{ steps.complete.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ladder"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"
