name: Security Review
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      # autofix needs contents:write to push its rewrite commit, and this repo
      # will not carry a PAT in public CI -- so autofix is explicitly refused
      # below rather than left to the action's own default, which this pin
      # (v2.1.2) flipped to "true". Left at the default, every run whose
      # review found anything to rewrite tried to push with this read-only
      # token and failed the job on a 403, regardless of what the PR touched.
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: review
        uses: thejefflarson/soundcheck-action@ba406c301382211d66118ebcc699267745f7f849  # v2.1.2
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          autofix: "false"
      # The action itself never fails the job on the review's own verdict --
      # it only comments and returns exit-code as an output (0 clean, 1
      # Critical/High findings, 2 infrastructure error). Without this step
      # the job is green on every run that doesn't hit a plumbing error,
      # which makes it a check that cannot report a real finding.
      #
      # Only exit-code 1 (a real Critical/High finding) fails the job here.
      # exit-code 2 is an infrastructure error inside the reviewer itself --
      # observed live and reproducibly on this pin in diff-scoped mode,
      # independent of anything a PR touches -- and gating on it would
      # recreate the exact "red on every PR" defect this workflow was fixed
      # for, just for a different underlying reason. It's surfaced as a
      # warning instead so it's visible without blocking.
      - name: Grade the review's exit code
        env:
          EXIT_CODE: ${{ steps.review.outputs.exit-code }}
        run: |
          case "$EXIT_CODE" in
            1) echo "::error::Soundcheck exit-code=1 -- see the PR comment or job summary."; exit 1 ;;
            2) echo "::warning::Soundcheck exit-code=2 -- the reviewer itself errored out, so this run says nothing about the PR's content." ;;
          esac
