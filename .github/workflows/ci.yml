name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every job picks its runner with an expression rather than a bare `runs-on:
# little-cpu-runners`: the pool is self-hosted and the repo is public, so a fork PR's own
# recipes must not run on it.
jobs:
  elaborate:
    name: elaborate
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 8
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: yosys write_cxxrtl, warnings promoted
        run: |
          set -euo pipefail
          if ! make elaborate-strict > /tmp/yosys-elaborate.log 2>&1; then
            echo "::error::elaboration failed before warnings were even graded"
            cat /tmp/yosys-elaborate.log
            exit 1
          fi
          cat /tmp/yosys-elaborate.log
          if grep -E '^Warning:' /tmp/yosys-elaborate.log | grep -vE 'Deep recursion in AST simplifier' > /tmp/promoted.log; then
            echo "::error::promoted yosys warning(s) -- CLAUDE.md: elaboration warnings are errors"
            cat /tmp/promoted.log
            exit 1
          fi
          echo "yosys write_cxxrtl: zero promoted warnings"

      - name: iverilog full-pipeline elaboration (second frontend)
        run: make rvfi_macros.vh testbench.vvp

      - name: iverilog full-pipeline simulation (one fixed program, graded)
        run: vvp testbench.vvp

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### elaborate"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest has no cross compiler, and the self-hosted image bakes one in
      # because its pods are runAsNonRoot and apt cannot install one there. On the pool
      # this step's condition is false.
      - name: Install the RISC-V cross compiler (fork PR routing only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf clang

      - name: Verify the toolchain is present in the runner image
        uses: ./.github/actions/verify-toolchain
        with:
          tools: riscv64-unknown-elf-gcc clang++

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: make test
        run: make test

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### test"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  mutation-check-shard:
    name: mutation-check-shard
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the RISC-V cross compiler (fork PR routing only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf clang

      - name: Verify the toolchain is present in the runner image
        uses: ./.github/actions/verify-toolchain
        with:
          tools: riscv64-unknown-elf-gcc clang++

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: make mutation-check
        run: |
          set -euo pipefail
          if ! make mutation-check MUTATION_SHARD=${{ matrix.shard }}/4; then
            echo "::error::a declared mutation was not caught by exactly the detectors test/MUTATION_DETECTORS pairs with it"
            exit 1
          fi

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### mutation-check shard ${{ matrix.shard }}"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # THE REQUIRED CHECK KEEPS ITS NAME: a required context that stops reporting blocks
  # every pull request rather than failing one.
  mutation-check:
    name: mutation-check
    needs: mutation-check-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to have passed
        run: |
          set -euo pipefail
          result='${{ needs.mutation-check-shard.result }}'
          echo "shards reported: $result"
          if [ "$result" != success ]; then
            echo "::error::a mutation-check shard did not pass; read the shard jobs for which pairing broke"
            exit 1
          fi

  cosim:
    name: cosim
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the RISC-V cross compiler (fork PR routing only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf clang

      - name: Verify the toolchain is present in the runner image
        uses: ./.github/actions/verify-toolchain
        with:
          tools: riscv64-unknown-elf-gcc clang++

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: Resolve the Sail pin and the directory the fetch is cached in
        id: pin
        run: |
          set -euo pipefail
          make sail-pin > "$RUNNER_TEMP/sail-pin.txt"
          cat "$RUNNER_TEMP/sail-pin.txt"
          grep -E '^(key|path)=' "$RUNNER_TEMP/sail-pin.txt" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned sail-riscv tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pin.outputs.path }}
          key: ${{ steps.pin.outputs.key }}

      - name: make sail-setup
        run: make sail-setup

      - name: make cosim-suite
        run: |
          set +e
          make cosim-suite > "$RUNNER_TEMP/cosim.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/cosim.txt"
          {
            echo "### co-simulation vs test/COSIM_EXPECTED_FAIL"
            echo '```'
            cat "$RUNNER_TEMP/cosim.txt"
            echo '```'
            echo "Each program's real register file against RISC-V International's"
            echo "executable specification. No rvfi_* signal is read on either"
            echo "side. It covers the programs it is given and nothing else, and"
            echo "the two baselined entries are the machine timer, which the"
            echo "reference model cannot express."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### cosim"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  components-proof:
    name: components-proof
    # One job per proof: independent sby tasks, serial only because they shared a job.
    strategy:
      fail-fast: false
      matrix:
        proof: [executor, decoder, accessor, pcloop, traps, busarbiter]
        include:
          - proof: executor
            title: Executor arithmetic BMC
          - proof: decoder
            title: Decoder component proof
          - proof: accessor
            title: Accessor one-transaction proof
          - proof: pcloop
            title: Fetcher/decoder PC-loop proof (+ its anti-vacuity cover)
          - proof: traps
            title: Trap commit proof
          - proof: busarbiter
            title: Bus arbiter proof (+ its cover and its forced red directions)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: What this runner actually has
        run: |
          # `nproc` and `free` both report the HOST from inside a container. Believe the
          # cgroup lines: v2's memory.max first, then v1's limit_in_bytes.
          echo "nproc (NOT the cap):$(nproc)"
          echo "cgroup cpu.max:     $(cat /sys/fs/cgroup/cpu.max 2>/dev/null \
            || { q=$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us 2>/dev/null); \
                 p=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us 2>/dev/null); \
                 [ -n "$q" ] && [ -n "$p" ] && echo "$q $p"; } \
            || echo unavailable)"
          echo "cgroup memory.max:  $(cat /sys/fs/cgroup/memory.max 2>/dev/null \
            || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null \
            || echo unavailable)"
          echo "cgroup memory used: $(cat /sys/fs/cgroup/memory.current 2>/dev/null \
            || cat /sys/fs/cgroup/memory/memory.usage_in_bytes 2>/dev/null \
            || echo unavailable)"
          echo "host free -h (NOT the pod's limit):"
          free -h 2>/dev/null || true

      - name: ${{ matrix.title }}
        run: make -C formal components_${{ matrix.proof }}

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### components-proof (${{ matrix.proof }})"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  components:
    name: components
    # THE REQUIRED CHECK KEEPS ITS NAME. `if: always()` is what makes it run when a proof
    # did not -- a skipped required check leaves the pull request waiting, not red.
    needs: components-proof
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every component proof to have passed
        run: |
          set -euo pipefail
          result='${{ needs.components-proof.result }}'
          echo "components-proof: $result"
          if [ "$result" != success ]; then
            echo "::error::a component proof did not pass; read components-proof"
            exit 1
          fi

  lint:
    name: lint
    # NOT the self-hosted pool: it is Linux/aarch64 and svlint publishes no aarch64
    # asset, so `make lint-setup` correctly refuses to fetch what it cannot verify.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install svlint at the pin
        run: make lint-setup

      - name: make lint
        run: make lint

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### lint"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  fit:
    name: fit
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 8
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: make fit
        # NEVER PIPE A GRADED COMMAND. Without an explicit `shell:` a step is `bash -e
        # {0}` -- errexit but not pipefail -- so `cmd | tee` takes tee's status and
        # always succeeds.
        run: |
          set +e
          make fit > "$RUNNER_TEMP/fit.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/fit.txt"
          {
            echo "### area (ADR-0038)"
            echo '```'
            cat "$RUNNER_TEMP/fit.txt"
            echo '```'
            echo "Logic cells on up5k/sg48, memories external. This job is a ratchet"
            echo "against \`FIT_MAX_LC\`, and it is in main's required set -- so a"
            echo "re-mapping that moves the count blocks a merge, which is why the"
            echo "budget is derived to clear a whole churn band."
            echo "The \`#\` lines above the count are the toolchain that produced it,"
            echo "from \`make fit-toolchain\`. They are the first thing \`make fit\`"
            echo "prints, so a synthesis or placement that dies still records what"
            echo "was running -- and \"did the tool move?\" is answerable from this"
            echo "run rather than from a guess about which release CI resolved."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### fit"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  soc-timing:
    name: soc-timing
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the RISC-V cross compiler (fork PR routing only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Verify the toolchain is present in the runner image
        uses: ./.github/actions/verify-toolchain
        with:
          tools: riscv64-unknown-elf-gcc

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: make soc-timing
        run: |
          set +e
          make soc-timing > "$RUNNER_TEMP/soc-timing.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/soc-timing.txt"
          {
            echo "### timing (ADR-0054)"
            echo '```'
            cat "$RUNNER_TEMP/soc-timing.txt"
            echo '```'
            echo "Critical path over the whole SoC (core + ROM + RAM), with the"
            echo "logic/routing split. This job grades \`SOC_MIN_MHZ\`, which is"
            echo "the 12 MHz board clock rather than a margin under the last"
            echo "measurement (ADR-0066), and it is in main's required set."
            echo "The \`#\` lines above the report are the toolchain that produced"
            echo "it, from \`make soc-timing-toolchain\` -- the same three lines"
            echo "\`soc/baseline_sweep.sh\` stamps a sweep with, so a placement here"
            echo "and one in a sweep can be told apart from a toolchain that moved"
            echo "under both."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### soc-timing"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # Gates the MAPPING and publishes the frequency. No Fmax ratchet: one placement is a
  # sample, and ECP5's churn band has not been derived.
  ecp5-timing:
    name: ecp5-timing
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the RISC-V cross compiler (fork PR routing only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Verify the toolchain is present in the runner image
        uses: ./.github/actions/verify-toolchain
        with:
          tools: riscv64-unknown-elf-gcc

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      # Asserted before any verdict is reported: a missing tool under a gate that is
      # otherwise green stays invisible until the day something goes red, and the
      # diagnostic then describes the wrong thing.
      - name: Confirm the ECP5 toolchain is complete
        run: |
          set -euo pipefail
          missing=0
          for tool in yosys nextpnr-ecp5; do
            if path=$(command -v "$tool"); then
              echo "$tool: $path"
            else
              echo "::error::$tool is not on PATH in the OSS CAD Suite"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::refusing to report a verdict on a toolchain that cannot" \
                 "run the flow: a missing tool would make every result here a" \
                 "statement about the runner rather than about the design."
            exit 1
          fi
          device=$(make print-ECP5_DEVICE)
          package=$(make print-ECP5_PACKAGE)
          speed=$(make print-ECP5_SPEED)
          if ! nextpnr-ecp5 "$device" --package "$package" --speed "$speed" --test \
                 > "$RUNNER_TEMP/ecp5-db.txt" 2>&1; then
            cat "$RUNNER_TEMP/ecp5-db.txt"
            echo "::error::the Trellis device database for $device $package speed" \
                 "$speed did not load, so no corner could be placed."
            exit 1
          fi
          echo "Trellis device database: $device $package speed $speed checks out"

      - name: make ecp5-timing
        run: |
          set +e
          make ecp5-timing > "$RUNNER_TEMP/ecp5-timing.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/ecp5-timing.txt"
          {
            echo "### ECP5 (ADR-0110's part)"
            echo '```'
            cat "$RUNNER_TEMP/ecp5-timing.txt"
            echo '```'
            echo "nextpnr's own estimate, from the model it routed with -- there is"
            echo "no icetime for ECP5, so the engine that placed the design is also"
            echo "the one that graded it. What is GATED here is the three exact"
            echo "censuses; the frequency is published, against a pinned constraint"
            echo "far above what the design reaches so that the number describes the"
            echo "design and not the target. NEVER merge or subtract an ECP5 number"
            echo "and an up5k one."
            echo "The \`#\` lines above are the toolchain that produced this, from"
            echo "\`make ecp5-timing-toolchain\`. Nothing about this instrument is"
            echo "pinned and its numbers have no derived band yet, so which yosys"
            echo "and which nextpnr answered matters more here than for the two"
            echo "up5k flows."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ecp5-timing"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # This is strictly weaker than sequential equivalence: it shows the RVFI
  # instrumentation is unread, not that the two designs behave alike.
  nonperturbation:
    name: nonperturbation
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 8
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: make -C formal nonperturbation
        run: |
          set +e
          make -C formal nonperturbation > "$RUNNER_TEMP/nonperturbation.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/nonperturbation.txt"
          {
            echo "### RVFI non-perturbation (ADR-0047)"
            echo '```'
            cat "$RUNNER_TEMP/nonperturbation.txt"
            echo '```'
            echo "A pass here means the RVFI instrumentation is UNREAD by the core."
            echo "It is not sequential equivalence and does not claim to be."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### nonperturbation"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  monitor-freshness:
    name: monitor-freshness
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: make monitor-check
        run: make monitor-check

      - name: make -C formal genchecks-check
        run: make -C formal genchecks-check

      - name: make -C nano/formal check-rvfi-insn-check
        run: make -C nano/formal check-rvfi-insn-check

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### monitor-freshness"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # What is gated is formal/check-baseline.sh's exit status, not sby's: every generated
  # .sby carries `expect pass,fail`, so sby exits 0 either way.
  formal-checks-shard:
    name: formal-checks-shard
    # A slice of the set, and it GRADES NOTHING: check-baseline.sh compares two sets
    # in both directions and needs every status at once. The collector below does that.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: Confirm the BMC toolchain is complete
        run: |
          set -euo pipefail
          missing=0
          for tool in yosys sby btormc btorsim; do
            if path=$(command -v "$tool"); then
              echo "$tool: $path"
            else
              echo "::error::$tool is not on PATH in the OSS CAD Suite"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::stopping on the missing tool named above, rather than" \
                 "letting every check report ERROR and leaving the cause to be" \
                 "inferred from that. check-baseline.sh would go red either way."
            exit 1
          fi

      - name: Run the generated checks (shard ${{ matrix.shard }} of 4)
        run: make -C formal check-shard CHECK_SHARD=${{ matrix.shard }}/4 JOBS=4

      - name: Hand the statuses to the collector
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-status-${{ matrix.shard }}
          path: formal/checks/*/status
          if-no-files-found: error
          retention-days: 1

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### formal-checks-shard (shard ${{ matrix.shard }})"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  formal-checks:
    name: formal-checks
    # THE COLLECTOR, and the only thing here that grades. It regenerates the .sby set
    # (deterministic), gathers every shard's statuses, and runs the two set-equalities
    # over the union. A shard that never ran leaves no status, which reads as NO-STATUS,
    # which is not PASS -- so a lost shard fails the baseline instead of shrinking it.
    needs: formal-checks-shard
    if: ${{ !cancelled() }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: Regenerate the check set
        run: make -C formal checks

      - name: Collect every shard's statuses
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: formal-status-*
          merge-multiple: true
          path: formal/checks

      - name: Gate on formal/EXPECTED_FAIL + formal/EXPECTED_CHECKS
        if: ${{ !cancelled() }}
        run: |
          set +e
          formal/check-baseline.sh formal/checks formal/EXPECTED_FAIL > "$RUNNER_TEMP/baseline-report.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/baseline-report.txt"
          {
            echo "### riscv-formal checks vs formal/EXPECTED_{FAIL,CHECKS}"
            echo '```'
            cat "$RUNNER_TEMP/baseline-report.txt"
            echo '```'
            echo "A match here means the check set still agrees with its baseline."
            echo "It is not a correctness result: every check is \`mode bmc\` (no"
            echo "counterexample within a bounded depth, not a proof), and the"
            echo "checks run under \`RISCV_FORMAL_ALTOPS\`, so the mul/div checks"
            echo "do not exercise the real multiplier or divider (ADR-0010)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### formal-checks"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  formal-checks-nano-shard:
    name: formal-checks-nano-shard
    # nano's 79, sliced the same way and grading nothing for the same reason.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: Confirm the BMC toolchain is complete
        run: |
          set -euo pipefail
          missing=0
          for tool in yosys sby btormc btorsim; do
            if path=$(command -v "$tool"); then
              echo "$tool: $path"
            else
              echo "::error::$tool is not on PATH in the OSS CAD Suite"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::stopping on the missing tool named above, rather than" \
                 "letting every check report ERROR and leaving the cause to be" \
                 "inferred from that. check-baseline.sh would go red either way."
            exit 1
          fi

      - name: Run the nanocpu checks (shard ${{ matrix.shard }} of 4)
        run: make -C nano/formal check-shard CHECK_SHARD=${{ matrix.shard }}/4 JOBS=4

      - name: Hand the statuses to the collector
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nano-status-${{ matrix.shard }}
          path: nano/formal/checks/*/status
          if-no-files-found: error
          retention-days: 1

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### formal-checks-nano-shard (shard ${{ matrix.shard }})"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  formal-checks-nano:
    name: formal-checks-nano
    # The collector for nano's set; grades the union, same as littlecpu's.
    needs: formal-checks-nano-shard
    if: ${{ !cancelled() }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: Regenerate the nanocpu check set
        run: make -C nano/formal checks

      - name: Collect every shard's statuses
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nano-status-*
          merge-multiple: true
          path: nano/formal/checks

      - name: Gate on nano/formal/EXPECTED_FAIL + EXPECTED_CHECKS
        if: ${{ !cancelled() }}
        run: |
          set +e
          formal/check-baseline.sh nano/formal/checks \
            nano/formal/EXPECTED_FAIL nano/formal/EXPECTED_CHECKS \
            > "$RUNNER_TEMP/nano-baseline-report.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/nano-baseline-report.txt"
          {
            echo "### nanocpu riscv-formal checks vs nano/formal/EXPECTED_{FAIL,CHECKS}"
            echo '```'
            cat "$RUNNER_TEMP/nano-baseline-report.txt"
            echo '```'
            echo "Same caveats as the main core's checks above: bounded \`mode bmc\`,"
            echo "and \`RISCV_FORMAL_ALTOPS\` means the mul/div checks do not exercise"
            echo "the real multiplier or divider."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### formal-checks-nano"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  formal-extra:
    name: formal-extra
    # Measured: dmemcheck 400 MB, imemcheck 364, complete 277, complete_cover 113, cover
    # 64.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: imemcheck (ADR-0003's dual-word fetch window)
        run: make -C formal imemcheck

      - name: dmemcheck
        run: make -C formal dmemcheck

      - name: cover (five goals, incl. >=2 compressed retires)
        run: make -C formal cover

      - name: complete (whole-ISA BMC walk, depth 50)
        run: make -C formal complete

      - name: complete_cover (anti-vacuity — every non-excluded class retires)
        run: make -C formal complete_cover

      - name: nanocpu imemcheck
        run: make -C nano/formal imemcheck

      - name: nanocpu dmemcheck
        run: make -C nano/formal dmemcheck

      - name: nanocpu complete (whole-ISA BMC walk, depth 20)
        run: make -C nano/formal complete

      - name: nanocpu complete_cover (anti-vacuity — every opcode class retires)
        run: make -C nano/formal complete_cover

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### formal-extra"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  formal:
    name: formal
    needs: [formal-checks, formal-checks-nano, formal-extra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every formal half to have passed
        run: |
          set -euo pipefail
          checks='${{ needs.formal-checks.result }}'
          nano='${{ needs.formal-checks-nano.result }}'
          extra='${{ needs.formal-extra.result }}'
          echo "formal-checks: $checks   nano: $nano   formal-extra: $extra"
          if [ "$checks" != success ] || [ "$nano" != success ] || [ "$extra" != success ]; then
            echo "::error::a formal half did not pass; read formal-checks and formal-extra"
            exit 1
          fi
