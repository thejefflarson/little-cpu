name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The repo is public and `little-cpu-runners` is a self-hosted pool: a job
# on it that runs a PR head's own `make`/shell recipes gives that PR author
# code execution inside the cluster once a maintainer has approved one of
# their runs, and GitHub does not ask again for that author's later PRs. So
# every job below picks its runner with this expression rather than a bare
# `runs-on: little-cpu-runners`:
#
#   ${{ (github.event_name != 'pull_request' ||
#        github.event.pull_request.head.repo.full_name == github.repository)
#       && 'little-cpu-runners' || 'ubuntu-latest' }}
#
# A fork PR gets ubuntu-latest under the SAME job name, not a skip: a skipped
# required check either blocks the PR forever or, depending on how branch
# protection is set, counts as passing -- and the second is worse than the
# exposure this guards. On `push`, `github.event.pull_request` does not
# exist, so the first disjunct is true and the second is never evaluated. On
# a pull_request from this repository's own branches -- how every PR here has
# been opened so far -- the head repo equals this one, so the second disjunct
# is true. Only a pull_request whose head repo is a fork takes ubuntu-latest.
jobs:
  elaborate:
    name: elaborate
    # Fork-PR routing: see the note above `jobs:` for what this picks and why.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 8
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: yosys write_cxxrtl, warnings promoted
        # `make elaborate-strict` runs `proc; opt_clean; check` before
        # write_cxxrtl, which is what reports "is used but has no driver"; the
        # bare recipe elaborates an undriven wire silently and exits 0.
        #
        # Do not spell the source list out here. This step once did, it diverged
        # from the Makefile's, and the gate spent a run elaborating a testbench
        # whose memory instances resolved to nothing.
        #
        # An allowlist rather than `yosys -e '.*'`: this design legitimately
        # emits "Deep recursion in AST simplifier", which carries no correctness
        # content. Implicit declarations and conflicting drivers already abort
        # hard before write_cxxrtl, so what is promoted here is undriven wires
        # and width mismatches.
        run: |
          set -euo pipefail
          if ! make elaborate-strict > /tmp/yosys-elaborate.log 2>&1; then
            echo "::error::elaboration failed before warnings were even graded"
            cat /tmp/yosys-elaborate.log
            exit 1
          fi
          cat /tmp/yosys-elaborate.log
          if grep -E '^Warning:' /tmp/yosys-elaborate.log | grep -vE 'Deep recursion in AST simplifier' > /tmp/promoted.log; then
            echo "::error::promoted yosys warning(s) -- CLAUDE.md: elaboration warnings are errors"
            cat /tmp/promoted.log
            exit 1
          fi
          echo "yosys write_cxxrtl: zero promoted warnings"

      - name: iverilog full-pipeline elaboration (second frontend)
        # rvfi_macros.vh clones the pinned riscv-formal, so this step also
        # exercises the from-scratch-clone pin guard.
        #
        # iverilog emits 16 "sorry: constant selects in always_* processes"
        # notes here, all against rtl/writeback.v's rvfi shadow reads, and still
        # exits 0. It was 20 before the write port moved to continuous assigns.
        # They are notes rather than warnings; do not grep for them.
        run: make rvfi_macros.vh testbench.vvp

      - name: iverilog full-pipeline simulation (one fixed program, graded)
        # test/testbench.v fatals on a nonzero monitor errcode or a write/retire
        # floor. Not the `.S` suite -- it has no image loader.
        run: vvp testbench.vvp

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### elaborate"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test
    # Fork-PR routing: see the note above `jobs:` for what this picks and why.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A fork PR routes here to ubuntu-latest (see the note above
      # `jobs:`), whose image has no RISC-V cross compiler baked in --
      # unlike the self-hosted pool's, where installing one is blocked by
      # runAsNonRoot. Installing before the assertion below is the bridge
      # between the two; on the self-hosted pool this step's condition is
      # false and it does not run.
      - name: Install the RISC-V cross compiler (fork PR routing only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf clang

      # An assertion, not an install: these runners are runAsNonRoot with
      # allowPrivilegeEscalation:false, so `sudo apt-get install` fails with
      # "the 'no new privileges' flag is set" and the cross compiler has to be
      # baked into the runner image instead.
      - name: Verify the toolchain is present in the runner image
        uses: ./.github/actions/verify-toolchain
        with:
          tools: riscv64-unknown-elf-gcc clang++

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: make test
        run: make test

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### test"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deletes a term from rtl/ and requires exactly the detectors
  # test/MUTATION_DETECTORS pairs with it to go red. `test` runs probe-gates,
  # which asks whether a graded comparison can report a failure at all; this
  # asks whether a program still detects the property it was written for, and
  # that has been answered no here more than once.
  #
  # A job of its own rather than a step of `test`: it rebuilds the cxxrtl runner
  # once per mutation, measured at 3m28s against that job's 70s, and it grows
  # with the manifest. It is shorter than `formal` and `components`, so it costs
  # a runner slot rather than wall time. A red result here reads as "a detector
  # stopped detecting", not as a suite failure.
  #
  # 25 minutes because it grows with the manifest and this step redirects its log:
  # at ten mutations it runs 12-13 minutes, so a 15-minute budget was at 85% of
  # itself. A job killed by its timeout is `cancelled` rather than `failure` and
  # publishes nothing, so it reads as a caught defect with no output to say
  # otherwise -- raise this before adding a mutation, not after.
  #
  # Same toolchain as `test`: this builds and runs `sim`, so it needs the cross
  # compiler, clang++ and yosys, and nothing that only synthesis or Sail needs.
  mutation-check:
    name: mutation-check
    # Fork-PR routing: see the note above `jobs:` for what this picks and why.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    # Ten mutations, each rebuilding the cxxrtl runner: about nine minutes of
    # work on an idle machine, on a runner pool the whole workflow shares. At 15
    # the budget was thin enough that a busy pool killed the job mid-run, and a
    # cancelled job with the log still inside the redirect below reads as a
    # failed gate rather than as a busy pool -- the same way `components` did at
    # 5. Every mutation added spends about a minute of this.
    timeout-minutes: 25
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fork-PR routing only -- see the `test` job for why.
      - name: Install the RISC-V cross compiler (fork PR routing only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf clang

      - name: Verify the toolchain is present in the runner image
        uses: ./.github/actions/verify-toolchain
        with:
          tools: riscv64-unknown-elf-gcc clang++

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: make mutation-check
        # NOT `make mutation-check | tee`. The default shell is errexit without
        # pipefail, so a pipeline's status becomes the last command's and this
        # gate would report `tee`'s. The log is redirected and printed here
        # instead, on both paths -- a plain `set -e` would exit before the `cat`
        # and a failing run would publish no output at all.
        run: |
          set -euo pipefail
          if ! make mutation-check > /tmp/mutation-check.log 2>&1; then
            cat /tmp/mutation-check.log
            echo "::error::a declared mutation was not caught by exactly the detectors test/MUTATION_DETECTORS pairs with it"
            exit 1
          fi
          cat /tmp/mutation-check.log

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### mutation-check"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # The only oracle here that reads the core's real register array instead of
  # the core's own report of what it retired. Every other leg evaluates a spec
  # model on rvfi_*, so a core that mis-reports a value and computes with that
  # same mis-reported value satisfies all of them and this one alone objects.
  #
  # A job of its own, and not a step of `test`: it needs a network fetch none of
  # the other jobs do, and a red result here has to read as "co-sim", not as a
  # suite failure. Nothing on `make test`'s path reaches any of it.
  cosim:
    name: cosim
    # Fork-PR routing: see the note above `jobs:` for what this picks and why.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fork-PR routing only -- see the `test` job for why.
      - name: Install the RISC-V cross compiler (fork PR routing only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf clang

      - name: Verify the toolchain is present in the runner image
        uses: ./.github/actions/verify-toolchain
        with:
          tools: riscv64-unknown-elf-gcc clang++

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      # Read out of the Makefile rather than written here, so the key names the
      # bytes the Makefile pins and cannot go on naming an older set.
      - name: Resolve the Sail pin and the directory the fetch is cached in
        id: pin
        run: |
          set -euo pipefail
          make sail-pin > "$RUNNER_TEMP/sail-pin.txt"
          cat "$RUNNER_TEMP/sail-pin.txt"
          grep -E '^(key|path)=' "$RUNNER_TEMP/sail-pin.txt" >> "$GITHUB_OUTPUT"

      # What is cached is the release tarball, not the unpacked tree, so the
      # restored bytes still have to meet the Makefile's SHA-256 in the run that
      # executes what comes out of them. A cache of the tree would put a binary
      # on PATH that met no checksum here at all.
      - name: Restore the pinned sail-riscv tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pin.outputs.path }}
          key: ${{ steps.pin.outputs.key }}

      - name: make sail-setup
        run: make sail-setup

      - name: make cosim-suite
        # Redirected rather than piped -- see the `fit` job for why. What is
        # graded is test/run_cosim.sh's exit status: the divergence set against
        # test/COSIM_EXPECTED_FAIL under set equality in both directions, so an
        # unexpected agreement is as red as an unexpected divergence.
        run: |
          set +e
          make cosim-suite > "$RUNNER_TEMP/cosim.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/cosim.txt"
          {
            echo "### co-simulation vs test/COSIM_EXPECTED_FAIL"
            echo '```'
            cat "$RUNNER_TEMP/cosim.txt"
            echo '```'
            echo "Each program's real register file against RISC-V International's"
            echo "executable specification. No rvfi_* signal is read on either"
            echo "side. It covers the programs it is given and nothing else, and"
            echo "the two baselined entries are the machine timer, which the"
            echo "reference model cannot express."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### cosim"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # Every task in formal/components.sby needs a step here or it runs nowhere.
  # The standalone decoder proof assumes its pc input is what it last produced,
  # and components_pcloop is what discharges that, so the decoder task's result
  # is worth only what pcloop's is.
  components:
    name: components
    # Fork-PR routing: see the note above `jobs:` for what this picks and why.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    # Four proofs in about four minutes, on a runner pool the whole workflow
    # shares. At 5 the budget was under a minute of headroom and the job was
    # killed after the fourth proof reported PASS, which reads as a failed gate
    # rather than as a busy pool. Adding a tenth job to the workflow is what
    # surfaced it.
    timeout-minutes: 10
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: Executor arithmetic BMC
        run: make -C formal components_executor

      - name: Decoder component proof
        run: make -C formal components_decoder

      - name: Accessor one-transaction proof
        run: make -C formal components_accessor

      # This one make also runs formal/pcloop_cover.sby, which is a prerequisite
      # of the target rather than a step of its own. That task is the proof's
      # anti-vacuity control: the increment assertion is excused on an
      # operand-fetch cycle, and an excuse widened until it covers every issuing
      # cycle would leave the assertion asking nothing. Wiring it as a
      # prerequisite is what stops the two from being run apart.
      - name: Fetcher/decoder PC-loop proof (+ its anti-vacuity cover)
        run: make -C formal components_pcloop

      - name: Trap commit proof
        run: make -C formal components_traps

      # This one make also runs formal/busarbiter_cover.sby and
      # formal/busarbiter-probe.py, both prerequisites of the target rather than
      # steps of their own. The cover says the arbiter still grants somebody and
      # still holds a lock, so the guarded assertions are reached at all; the
      # probe builds a fixed-priority arbiter and a mid-lock one and requires
      # the wait bound and the indivisibility arm to go red for their own
      # reasons. Starvation has no other grader -- no torture program can catch
      # it.
      - name: Bus arbiter proof (+ its cover and its forced red directions)
        run: make -C formal components_busarbiter

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### components"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint
    # NOT the self-hosted pool, and not the fork-PR expression the other jobs
    # use: that pool is Linux/aarch64, and svlint publishes no aarch64 Linux
    # asset at any release, so `make lint-setup` correctly refuses to fetch
    # something it cannot verify and this job cannot run there at all. It needs
    # only a checkout and svlint, so a hosted x86_64 runner costs nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install svlint at the pin
        run: make lint-setup

      - name: make lint
        # GITHUB_ACTIONS is set on every runner, so `make lint` passes
        # --github-actions and each finding also lands as an ::error annotation
        # on the PR diff.
        run: make lint

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### lint"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # Quote this job's number and name the toolchain with it: the same commit
  # synthesises 32 cells lower here than under a local Homebrew yosys. The setup
  # action resolves the latest OSS CAD Suite rather than pinning it -- what
  # formal/pin.mk pins is riscv-formal, not this -- so this count can move with
  # no RTL changing. Not in main's required set, deliberately -- area is a
  # design constraint, not a correctness one.
  fit:
    name: fit
    # Fork-PR routing: see the note above `jobs:` for what this picks and why.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 8
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: make fit
        # Never pipe a graded command in a `run:` block. Without an explicit
        # `shell:` key the step is `bash -e {0}` -- errexit but not pipefail --
        # so `cmd | tee` takes its status from `tee` and always succeeds. This
        # repo shipped exactly that once. The same shape in `soc-timing`,
        # `nonperturbation` and the `formal` gate is this rule.
        #
        # `make fit` expects placement to FAIL: the fit top presents 231 SB_IO
        # against sg48's 39, so nextpnr always errors on a pad, after printing
        # the utilisation table that is the measurement. The Makefile checks for
        # that table, so "died before measuring anything" is red.
        run: |
          set +e
          make fit > "$RUNNER_TEMP/fit.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/fit.txt"
          {
            echo "### area (ADR-0038)"
            echo '```'
            cat "$RUNNER_TEMP/fit.txt"
            echo '```'
            echo "Logic cells on up5k/sg48, memories external. This job is a ratchet"
            echo "against \`FIT_MAX_LC\`, and it is in main's required set -- so a"
            echo "re-mapping that moves the count blocks a merge, which is why the"
            echo "budget is derived to clear a whole churn band."
            echo "The \`#\` lines above the count are the toolchain that produced it,"
            echo "from \`make fit-toolchain\`. They are the first thing \`make fit\`"
            echo "prints, so a synthesis or placement that dies still records what"
            echo "was running -- and \"did the tool move?\" is answerable from this"
            echo "run rather than from a guess about which release CI resolved."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### fit"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # In main's required set, unlike `fit`: the floor it grades is the clock the
  # board runs at, so missing it means the design does not run on the target
  # part. It needs the cross compiler because it assembles a real ROM image
  # before synthesising, and unlike `fit` it expects placement to SUCCEED --
  # icetime has no `.asc` to read otherwise.
  soc-timing:
    name: soc-timing
    # Fork-PR routing: see the note above `jobs:` for what this picks and why.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fork-PR routing only -- see the `test` job for why.
      - name: Install the RISC-V cross compiler (fork PR routing only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Verify the toolchain is present in the runner image
        uses: ./.github/actions/verify-toolchain
        with:
          tools: riscv64-unknown-elf-gcc

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: make soc-timing
        # Redirected rather than piped -- see the `fit` job for why. The summary
        # is written before the exit, so the census and the logic/routing split
        # land whether this passes or fails.
        run: |
          set +e
          make soc-timing > "$RUNNER_TEMP/soc-timing.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/soc-timing.txt"
          {
            echo "### timing (ADR-0054)"
            echo '```'
            cat "$RUNNER_TEMP/soc-timing.txt"
            echo '```'
            echo "Critical path over the whole SoC (core + ROM + RAM), with the"
            echo "logic/routing split. This job grades \`SOC_MIN_MHZ\`, which is"
            echo "the 12 MHz board clock rather than a margin under the last"
            echo "measurement (ADR-0066), and it is in main's required set."
            echo "The \`#\` lines above the report are the toolchain that produced"
            echo "it, from \`make soc-timing-toolchain\` -- the same three lines"
            echo "\`soc/baseline_sweep.sh\` stamps a sweep with, so a placement here"
            echo "and one in a sweep can be told apart from a toolchain that moved"
            echo "under both."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### soc-timing"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # The third instrument, and the first one that is not up5k. Same `littlesoc`,
  # same SOC_SRCS, same ROM image, placed on the ECP5 the multi-core milestone
  # targets. It gates the MAPPING -- three exact censuses -- and publishes the
  # frequency; there is no Fmax ratchet here, because one placement is a sample
  # and ECP5's own churn band has not been derived yet.
  #
  # NOT in main's required set, and making it required is a branch-protection
  # change rather than a change to this file. Which jobs are required is a
  # repository setting, so read it live:
  #
  #   gh api repos/thejefflarson/little-cpu/branches/main/protection \
  #     -q '.required_status_checks.contexts'
  #
  # It needs the cross compiler for the same reason `soc-timing` does: it
  # assembles a real ROM image before synthesising.
  ecp5-timing:
    name: ecp5-timing
    # Fork-PR routing: see the note above `jobs:` for what this picks and why.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fork-PR routing only -- see the `test` job for why.
      - name: Install the RISC-V cross compiler (fork PR routing only)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Verify the toolchain is present in the runner image
        uses: ./.github/actions/verify-toolchain
        with:
          tools: riscv64-unknown-elf-gcc

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      # Asserted BEFORE any verdict is reported, for the reason the `formal` job
      # asserts btorsim: a tool missing under a gate that is otherwise green is
      # invisible until the day something goes red, and the diagnostic then
      # describes the wrong thing.
      #
      # The device database is checked by ASKING nextpnr for the exact corner
      # this measurement is declared against, rather than by probing wherever a
      # given install happens to put Trellis. `--test` walks that device's BELs
      # and PIPs in about four seconds, and it is the corner the Makefile
      # declares rather than a corner written out again here.
      - name: Confirm the ECP5 toolchain is complete
        run: |
          set -euo pipefail
          missing=0
          for tool in yosys nextpnr-ecp5; do
            if path=$(command -v "$tool"); then
              echo "$tool: $path"
            else
              echo "::error::$tool is not on PATH in the OSS CAD Suite"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::refusing to report a verdict on a toolchain that cannot" \
                 "run the flow: a missing tool would make every result here a" \
                 "statement about the runner rather than about the design."
            exit 1
          fi
          device=$(make print-ECP5_DEVICE)
          package=$(make print-ECP5_PACKAGE)
          speed=$(make print-ECP5_SPEED)
          if ! nextpnr-ecp5 "$device" --package "$package" --speed "$speed" --test \
                 > "$RUNNER_TEMP/ecp5-db.txt" 2>&1; then
            cat "$RUNNER_TEMP/ecp5-db.txt"
            echo "::error::the Trellis device database for $device $package speed" \
                 "$speed did not load, so no corner could be placed."
            exit 1
          fi
          echo "Trellis device database: $device $package speed $speed checks out"

      - name: make ecp5-timing
        # Redirected rather than piped -- see the `fit` job for why. The summary
        # is written before the exit, so the censuses and the frequency land
        # whether this passes or fails.
        run: |
          set +e
          make ecp5-timing > "$RUNNER_TEMP/ecp5-timing.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/ecp5-timing.txt"
          {
            echo "### ECP5 (ADR-0110's part)"
            echo '```'
            cat "$RUNNER_TEMP/ecp5-timing.txt"
            echo '```'
            echo "nextpnr's own estimate, from the model it routed with -- there is"
            echo "no icetime for ECP5, so the engine that placed the design is also"
            echo "the one that graded it. What is GATED here is the three exact"
            echo "censuses; the frequency is published, against a pinned constraint"
            echo "far above what the design reaches so that the number describes the"
            echo "design and not the target. NEVER merge or subtract an ECP5 number"
            echo "and an up5k one."
            echo "The \`#\` lines above are the toolchain that produced this, from"
            echo "\`make ecp5-timing-toolchain\`. Nothing about this instrument is"
            echo "pinned and its numbers have no derived band yet, so which yosys"
            echo "and which nextpnr answered matters more here than for the two"
            echo "up5k flows."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### ecp5-timing"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # The `-D RISCV_FORMAL` build, with its rvfi_* ports deleted and every gate
  # that only fed them swept away, must be structurally identical to the plain
  # build. Strictly weaker than sequential equivalence and must not be quoted as
  # if it were: it shows the instrumentation is unread, not that two designs
  # behave alike.
  #
  # Not in main's required set. Which jobs are is a repository setting, so read
  # it live rather than from any comment here:
  #
  #   gh api repos/thejefflarson/little-cpu/branches/main/protection \
  #     -q '.required_status_checks.contexts'
  nonperturbation:
    name: nonperturbation
    # Fork-PR routing: see the note above `jobs:` for what this picks and why.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 8
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: make -C formal nonperturbation
        # Redirected rather than piped -- see the `fit` job for why.
        run: |
          set +e
          make -C formal nonperturbation > "$RUNNER_TEMP/nonperturbation.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/nonperturbation.txt"
          {
            echo "### RVFI non-perturbation (ADR-0047)"
            echo '```'
            cat "$RUNNER_TEMP/nonperturbation.txt"
            echo '```'
            echo "A pass here means the RVFI instrumentation is UNREAD by the core."
            echo "It is not sequential equivalence and does not claim to be."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### nonperturbation"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # Both steps need a from-scratch riscv-formal clone at the pin, which a fresh
  # runner gives for free, and nothing but python3 and git.
  monitor-freshness:
    name: monitor-freshness
    # Fork-PR routing: see the note above `jobs:` for what this picks and why.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: make monitor-check
        run: make monitor-check

      # The same control for the repo's other vendored generated file:
      # formal/genchecks-local.py may differ from the pin's checks/genchecks.py
      # only by this repo's header and `basedir`.
      - name: make -C formal genchecks-check
        run: make -C formal genchecks-check

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### monitor-freshness"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # What is gated here is formal/check-baseline.sh's exit status, not sby's:
  # every generated .sby carries `expect pass,fail`, so sby exits 0 whether a
  # check passed or failed and its exit code never carried a verdict. The
  # verdict is the two set equalities check-baseline.sh performs.
  #
  # A green run means the checks still match their baseline and nothing more.
  # Every one is `mode bmc`, and they all run under RISCV_FORMAL_ALTOPS, so a
  # passing insn_mul or insn_div says nothing about the real multiplier or
  # divider.
  formal:
    name: formal
    # GitHub-hosted for memory, not packaging. One check peaks around 876 MiB
    # resident (insn_add_ch0, measured) and the in-cluster pod has a 1.5 GiB
    # limit with ~836 MiB already held at job start, so a single check does not
    # fit there at any parallelism.
    runs-on: ubuntu-latest
    # Loose because there is no per-check wall bound: one non-converging check
    # starves everything scheduled after it, and `-k` does not help because the
    # job dies rather than the check.
    timeout-minutes: 20
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      # sby's btor engine replays a counterexample with btorsim, so btorsim is
      # reached only by a check that found one -- without it, every red check
      # reports ERROR instead of FAIL. With everything green its absence is
      # therefore invisible until the first check goes red, and the diagnostic
      # then reads "status changed" rather than "install btorsim".
      - name: Confirm the BMC toolchain is complete
        run: |
          set -euo pipefail
          missing=0
          for tool in yosys sby btormc btorsim; do
            if path=$(command -v "$tool"); then
              echo "$tool: $path"
            else
              echo "::error::$tool is not on PATH in the OSS CAD Suite"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::formal/check-baseline.sh cannot tell ERROR from FAIL," \
                 "so an incomplete toolchain would make this gate green on a" \
                 "check set that never really ran. Refusing to report a verdict."
            exit 1
          fi

      # JOBS is a memory budget, not a speed knob: one check peaks around
      # 876 MiB resident, so the footprint is roughly JOBS GiB and 4 fits a
      # 16 GiB hosted runner. formal/Makefile defaults it to `nproc`, which is
      # right on a workstation and wrong in a container, where a CPU quota does
      # not narrow the affinity mask. The diagnostics below print what the host
      # actually has; re-tune against those rather than guessing.
      - name: Generate and run the checks (make -C formal check)
        run: |
          set -uo pipefail
          echo "nproc:            $(nproc)"
          echo "cgroup cpu.max:   $(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unavailable)"
          echo "cgroup memory.max:$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unavailable)"
          free -h 2>/dev/null || true
          make -C formal check JOBS=4

      # The step above already ends in this same comparison, so the two agree by
      # construction; re-grading re-runs no check and publishes the verdict
      # instead of leaving it inferred. `!cancelled()` because if the step above
      # goes red this one is what says why -- and a run that failed to generate
      # at all exits 2 here ("no *.sby files"), so a red step above cannot be
      # followed by a green one here.
      - name: Gate on formal/EXPECTED_FAIL + formal/EXPECTED_CHECKS
        if: ${{ !cancelled() }}
        run: |
          # Redirected rather than piped -- see the `fit` job for why.
          # Demonstrated here: with `| tee` in place, a deliberately wrong
          # formal/EXPECTED_FAIL printed "Failure list does NOT match" and the
          # job still reported success.
          set +e
          formal/check-baseline.sh formal/checks formal/EXPECTED_FAIL > "$RUNNER_TEMP/baseline-report.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/baseline-report.txt"
          {
            echo "### riscv-formal checks vs formal/EXPECTED_{FAIL,CHECKS}"
            echo '```'
            cat "$RUNNER_TEMP/baseline-report.txt"
            echo '```'
            echo "A match here means the check set still agrees with its baseline."
            echo "It is not a correctness result: every check is \`mode bmc\` (no"
            echo "counterexample within a bounded depth, not a proof), and the"
            echo "checks run under \`RISCV_FORMAL_ALTOPS\`, so the mul/div checks"
            echo "do not exercise the real multiplier or divider (ADR-0010)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The hand-authored tasks. formal/EXPECTED_FAIL covers the genchecks sweep
      # only, so each one's verdict is its own exit status. One step each rather
      # than one step running three `make`s, because make stops at the first
      # failure and the log would read as a single one.
      - name: imemcheck (ADR-0003's dual-word fetch window)
        run: make -C formal imemcheck

      - name: dmemcheck
        run: make -C formal dmemcheck

      - name: cover (five goals, incl. >=2 compressed retires)
        run: make -C formal cover

      # complete.sby carries no `expect` line, unlike every generated check, so
      # this step's status is sby's own.
      #
      # A green run means every non-trapping retire the core reports, on any
      # trace of at most 50 cycles, carries an encoding riscv-formal's whole-ISA
      # model recognises. Each of the 70 insn_* checks constrains rvfi_insn to
      # its own encoding, so an encoding none of them names is invisible to all
      # of them, and this is what sees it. It says nothing about spec values and
      # is silent on the classes in formal/COMPLETE_EXCLUSIONS.
      #
      # complete.sby runs `abc bmc3`, a third engine after `btor btormc` and
      # components.sby's `smtbmc boolector`, so the btorsim check above does not
      # cover it.
      - name: complete (whole-ISA BMC walk, depth 50)
        run: make -C formal complete

      # `complete`'s assertion is guarded by `rvfi_valid`, `!rvfi_trap` and
      # `!insn_excluded`, so a core that never retired, or claimed a trap on
      # everything, or an exclusion set grown to swallow the ISA would each pass
      # it having been asked nothing. Green above without green here is not a
      # result.
      - name: complete_cover (anti-vacuity — every non-excluded class retires)
        run: make -C formal complete_cover

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### formal"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"
