name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: nothing in this workflow pushes, comments, or writes
# back anywhere. Set once at workflow level so no job needs a wider
# permissions: block of its own.
permissions:
  contents: read

# oss-cad-suite-linux-x64-20260629.tgz is 719 MB (measured, JEF-608), so
# every job that needs yosys/iverilog/sby restores it from actions/cache
# instead of re-downloading. The tag and the filename below must name the
# same release (https://github.com/YosysHQ/oss-cad-suite-build/releases);
# bump them together.
env:
  OSS_CAD_SUITE_TAG: "2026-06-29"
  OSS_CAD_SUITE_FILE: "oss-cad-suite-linux-x64-20260629.tgz"
  # Upstream does not publish a checksum asset for this release, so this is
  # this repo's own pin: computed locally from the tarball fetched at the
  # URL below, the same "don't trust the dependency, pin what you got"
  # posture as formal/pin.mk (ADR-0013). Verified below before the archive
  # is ever extracted.
  OSS_CAD_SUITE_SHA256: "dfb5df3c28599081d2baca13884c069c025b1990c86e90f4a4d84aadcd255cc5"

jobs:
  # yosys write_cxxrtl (JEF-608 acceptance #3) plus the iverilog leg
  # (test/testbench.v + rtl + test/monitor.v under iverilog -- the "second
  # elaboration frontend" in CLAUDE.md's verification table, unblocked by
  # eb18320). Neither leg runs a single test vector; both just prove the
  # design elaborates.
  elaborate:
    name: elaborate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite
        with:
          tag: ${{ env.OSS_CAD_SUITE_TAG }}
          file: ${{ env.OSS_CAD_SUITE_FILE }}
          sha256: ${{ env.OSS_CAD_SUITE_SHA256 }}

      - name: yosys write_cxxrtl, warnings promoted
        # Same file list and script as the Makefile's test/rtl.cc recipe,
        # with `proc; opt_clean; check` inserted ahead of write_cxxrtl.
        # Verified locally: the bare Makefile recipe elaborates a wire that
        # is read but never driven with *zero* diagnostic output and exit
        # 0 -- `check` is what actually reports "is used but has no
        # driver". That can't be added to the tracked Makefile recipe
        # (JEF-608 is .github/-only; rtl/, test/, and the Makefile belong
        # to JEF-607), so the stricter pipeline lives here instead, against
        # the same sources.
        #
        # The promotion below is a curated list, not `yosys -e '.*'`: this
        # design legitimately emits "Warning: Deep recursion in AST
        # simplifier" on some inputs (see CLAUDE.md's technical notes),
        # which is a recursion-depth notice, not a correctness signal, and
        # must not fail the build. Everything else yosys prefixes
        # "Warning:" is promoted. Implicit declarations and
        # multiple/conflicting drivers were confirmed locally to already
        # abort elaboration with a hard ERROR (nonzero exit) before
        # write_cxxrtl runs, so in practice this line promotes the two
        # classes that would otherwise elaborate silently: undriven wires
        # and width mismatches.
        run: |
          set -euo pipefail
          yosys -p '
            read_verilog -sv rtl/structs.v rtl/accessor.v rtl/decoder.v rtl/executor.v rtl/fetcher.v rtl/regfile.v rtl/writeback.v rtl/littlecpu.v test/testbench.v
            hierarchy -top testbench
            proc
            opt_clean
            check
            write_cxxrtl /tmp/elaborate-strict.cc
          ' 2>&1 | tee /tmp/yosys-elaborate.log
          if grep -E '^Warning:' /tmp/yosys-elaborate.log | grep -vE 'Deep recursion in AST simplifier' > /tmp/promoted.log; then
            echo "::error::promoted yosys warning(s) -- CLAUDE.md: elaboration warnings are errors"
            cat /tmp/promoted.log
            exit 1
          fi
          echo "yosys write_cxxrtl: zero promoted warnings"

      - name: iverilog full-pipeline elaboration (second frontend)
        # testbench.vvp needs rvfi_macros.vh, an existing Makefile target
        # that clones the pinned riscv-formal (formal/pin.mk) -- harmless
        # here, and exercises the same from-scratch-clone pin guard
        # ADR-0013 asks CI to run.
        #
        # iverilog emits ~30 "sorry: constant selects in always_* processes"
        # notes on this design (constant bit-selects inside always_* blocks
        # -- a real iverilog limitation, not a bug in this RTL) and still
        # exits 0. Do not grep for them: they are notes, not warnings, and
        # CLAUDE.md's technical notes call this out by name as a known,
        # separately-tracked class this gate must not block on.
        run: make rvfi_macros.vh testbench.vvp

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### elaborate"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # The ADR-0007/ADR-0008 cxxrtl regression gate: builds `sim`, runs
  # test-units (the iverilog RTL-level benches), then every test/asm/*.S
  # under `sim` and checks the pass/fail table against test/EXPECTED_FAIL
  # (ADR-0014's M1 baseline). Exits 0 today -- 46/46 TIMEOUT matches the
  # baseline exactly, an honest gate on a still-broken core -- and goes red
  # the moment that match slips.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install RISC-V cross compiler
        # `make setup` only installs this on macOS (brew); on Linux it just
        # prints the apt command (Makefile's setup target). Run that
        # command directly instead of adding a CI-only Makefile target.
        # clang is pulled explicitly too rather than assumed present on the
        # runner image -- `sim`'s recipe hardcodes clang++.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf clang

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite
        with:
          tag: ${{ env.OSS_CAD_SUITE_TAG }}
          file: ${{ env.OSS_CAD_SUITE_FILE }}
          sha256: ${{ env.OSS_CAD_SUITE_SHA256 }}

      - name: make test
        run: make test

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### test"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # ADR-0006 scopes component proofs to exactly two: decoder and executor.
  # decoder FAILs by design (a pre-existing compressed-PC-increment
  # assertion, `past_pc + 2 == pc`, unrelated to this ticket and tracked
  # separately) so it cannot be a required gate. executor passes by
  # k-induction under a 4-bit operand restriction (ADR-0010) and is the
  # only one run here. components_executor is an existing formal/Makefile
  # target; this job does not add one.
  components:
    name: components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite
        with:
          tag: ${{ env.OSS_CAD_SUITE_TAG }}
          file: ${{ env.OSS_CAD_SUITE_FILE }}
          sha256: ${{ env.OSS_CAD_SUITE_SHA256 }}

      - name: Executor arithmetic BMC
        run: make -C formal components_executor

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### components"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # Regenerates test/monitor.v from a from-scratch riscv-formal clone at
  # the pin (formal/pin.mk) and diffs it against the tracked copy
  # (CLAUDE.md invariant 7: generated but tracked, never hand-edited).
  # ADR-0013 asks CI to run this from a from-scratch clone, which is what a
  # fresh runner gives for free -- no oss-cad-suite needed here, just
  # python3 and git, both preinstalled.
  monitor-freshness:
    name: monitor-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: make monitor-check
        run: make monitor-check

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### monitor-freshness"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"
