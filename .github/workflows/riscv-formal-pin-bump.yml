# Re-syncs test/monitor.v and nano/formal/rvfi_insn_check.sv -- see bump-riscv-formal-pin.sh.
name: riscv-formal pin bump

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: write # git push, for the branch carrying the bump
  issues: write # gh issue create

jobs:
  check-and-bump:
    name: check-and-bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: decide
        id: decide
        run: formal/pin-bump-decide.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No GH_TOKEN: this step executes upstream code.
      - name: regenerate
        if: steps.decide.outputs.proceed == 'yes'
        run: |
          formal/bump-riscv-formal-pin.sh \
            '${{ steps.decide.outputs.pin_sha }}' \
            '${{ steps.decide.outputs.upstream_sha }}' \
            '${{ steps.decide.outputs.branch }}' \
            '${{ steps.decide.outputs.title }}' \
            "$RUNNER_TEMP/pin-bump"

      - name: publish
        if: steps.decide.outputs.proceed == 'yes'
        run: |
          gh auth setup-git
          formal/publish-pin-bump.sh \
            '${{ steps.decide.outputs.branch }}' \
            '${{ steps.decide.outputs.title }}' \
            "$RUNNER_TEMP/pin-bump"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
