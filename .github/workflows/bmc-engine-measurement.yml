name: bmc-engine-measurement

# Throwaway instrument, unmerged. Reads each proof's own pod high-water mark,
# since #303 gave every proof a pod and a burst ceiling is what OOM-kills.

on:
  workflow_dispatch:
  push:
    branches: [thejefflarson/bmc-engine-measurement]

permissions:
  contents: read

jobs:
  proof:
    name: proof (${{ matrix.proof }})
    strategy:
      fail-fast: false
      matrix:
        proof: [executor, decoder, accessor, pcloop, traps, busarbiter]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'little-cpu-runners' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: Run the proof as it ships, and read the pod high-water mark
        run: |
          limit=$(cat /sys/fs/cgroup/memory.max)
          before=$(cat /sys/fs/cgroup/memory.peak)
          start=$(date +%s)
          make -C formal components_${{ matrix.proof }}
          end=$(date +%s)
          after=$(cat /sys/fs/cgroup/memory.peak)
          if [ "$after" -le "$before" ]; then
            echo "memory.peak did not move ($before -> $after): nothing was measured." >&2
            exit 1
          fi
          echo "| ${{ matrix.proof }} | $((end - start))s | $((after / 1048576)) MB | $(( (limit - after) / 1048576 )) MB |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "${{ matrix.proof }}: $((end - start))s, peak $((after / 1048576)) MB, headroom $(( (limit - after) / 1048576 )) MB of $((limit / 1048576)) MB"
