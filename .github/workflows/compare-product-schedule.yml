name: Cross-core product re-take

# Weekly, re-measures every cross-core throughput pair soc/compare/ knows -- Dhrystone
# against VexRiscv and CoreMark against VexRiscv and Hazard3, on both up5k and ECP5 --
# and opens a pull request only when the OLD stamp would have called itself stale against
# the tree this run checked out.
on:
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: write # git push, for the branch carrying the refreshed stamp
  pull-requests: write # gh pr create

jobs:
  re-take:
    name: re-take
    # workflow_dispatch can target any ref; this job pushes a branch and opens a PR,
    # so it only ever measures and publishes from main.
    if: github.ref == 'refs/heads/main'
    runs-on: little-cpu-runners
    # 72 placements plus both benchmarks: ~60 min on a machine that runs `make ecp5-timing`
    # 2.3x faster than this pool, so ~140 here. Never yet timed on the pool itself.
    timeout-minutes: 300
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the toolchain is present in the runner image
        uses: ./.github/actions/verify-toolchain
        with:
          tools: riscv64-unknown-elf-gcc

      - name: Set up OSS CAD Suite
        uses: ./.github/actions/setup-oss-cad-suite

      - name: Save the currently committed stamp
        run: |
          if [ -f soc/compare/product.json ]; then
            cp soc/compare/product.json /tmp/product.before.json
          else
            echo '{}' > /tmp/product.before.json
          fi

      - name: make compare-product
        run: make compare-product

      - name: Diff against the committed stamp
        id: diff
        run: |
          set -euo pipefail
          python3 soc/compare/product_diff.py /tmp/product.before.json soc/compare/product.json \
            | tee /tmp/product-diff.md

          # `make print-VAR` never errors on a VAR this tree does not define --
          # it echoes an empty line (Makefile's print-% recipe) -- so a tree
          # without COMPARE_COREMARK_CFLAGS would otherwise hand
          # --require-news an empty --current value with no diagnostic.
          # product_check.py's stale_reasons() now refuses an empty --current
          # value outright, so build the CoreMark argument only when the build
          # actually has one, and say so either way rather than leaving the
          # field's presence to be inferred from the diff below.
          DHRY_CFLAGS=$(make -s print-COMPARE_DHRY_CFLAGS)
          ROM_WORDS=$(make -s print-COMPARE_ROM_WORDS)
          RAM_WORDS=$(make -s print-COMPARE_RAM_WORDS)
          COREMARK_CFLAGS=$(make -s print-COMPARE_COREMARK_CFLAGS)
          if [ -n "$COREMARK_CFLAGS" ]; then
            echo "COMPARE_COREMARK_CFLAGS is defined; checking CoreMark's cflags for staleness."
          else
            echo "COMPARE_COREMARK_CFLAGS is undefined on this tree; not checking CoreMark's cflags for staleness."
          fi

          # Ask the freshly-written stamp which pairs actually exist, rather
          # than hand-typing soc/compare/run_product.sh's dhrystone_ecp5/
          # coremark_ecp5 naming convention a second time here -- a part this
          # script does not know about still gets checked. Captured into a
          # variable rather than read from a process substitution: `set -e`
          # does not see a process substitution's exit status, so a broken
          # python3 call there would silently iterate zero pairs instead of
          # failing the step.
          pairs=$(python3 -c "import json; print('\n'.join(sorted(json.load(open('soc/compare/product.json')).get('pairs', {}))))")
          if [ -z "$pairs" ]; then
            echo "*** soc/compare/product.json names no pairs; refusing to" >&2
            echo "*** check none of them for staleness." >&2
            exit 1
          fi
          current_args=()
          while IFS= read -r pair; do
            [ -n "$pair" ] || continue
            case "$pair" in
              dhrystone|dhrystone_*)
                current_args+=(--current "$pair:cflags=$DHRY_CFLAGS" \
                               --current "$pair:rom_words=$ROM_WORDS" \
                               --current "$pair:ram_words=$RAM_WORDS") ;;
              coremark|coremark_*)
                [ -n "$COREMARK_CFLAGS" ] &&
                  current_args+=(--current "$pair:cflags=$COREMARK_CFLAGS") ;;
              *)
                echo "*** soc/compare/product.json names a pair '$pair' this" >&2
                echo "*** step does not recognise; refusing rather than" >&2
                echo "*** silently not checking it for staleness." >&2
                exit 1 ;;
            esac
          done <<< "$pairs"

          # --require-news asks soc/compare/product_check.py's own question of
          # the OLD stamp against the tree this run checked out -- rtl/,
          # soc/compare/, or a --current value moved -- rather than a
          # percentage threshold on the result. Never in a pipeline: the
          # graded call's own status is what this step reports, not `tee`'s --
          # see CLAUDE.md's rule against exactly that.
          # THREE statuses, branched on by number rather than by if/else: 0 is
          # news, 1 is no news, and anything else is product_diff.py refusing
          # the question -- an empty --current, an unreadable stamp, no git.
          # Collapsed into an else, a refusal reports as "nothing moved enough
          # to be news" and the run looks identical to a clean negative, which
          # is the shape of silence this whole step exists to avoid.
          set +e
          python3 soc/compare/product_diff.py /tmp/product.before.json \
               soc/compare/product.json --require-news --repo . \
               "${current_args[@]}"
          rc=$?
          set -e
          case $rc in
            0) echo "moved=true"  >> "$GITHUB_OUTPUT" ;;
            1) echo "moved=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "product_diff.py refused the question (exit $rc); failing the job" >&2
               exit $rc ;;
          esac

      - name: Upload the freshly measured stamp
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compare-product-stamp
          path: |
            soc/compare/product.json
            /tmp/product-diff.md
          if-no-files-found: warn
          retention-days: 14

      - name: No move -- say so and stop
        if: steps.diff.outputs.moved != 'true'
        run: |
          {
            echo "### Cross-core product re-take: no change"
            echo
            echo "Re-measured $(date -u '+%Y-%m-%dT%H:%M:%SZ'); nothing moved enough to be"
            echo "news. Not opening a PR."
            echo
            cat /tmp/product-diff.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open a PR with the refreshed stamp
        if: steps.diff.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          branch="compare-product/refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add soc/compare/product.json
          {
            echo "Refresh the cross-core product stamp"
            echo
            cat /tmp/product-diff.md
          } > /tmp/commit-message.md
          git commit -F /tmp/commit-message.md
          git push --quiet origin "$branch"
          {
            cat /tmp/product-diff.md
            echo
            echo "Machine-refreshed by \`.github/workflows/compare-product-schedule.yml\`."
            echo "This PR only updates \`soc/compare/product.json\`. CLAUDE.md's cross-core"
            echo "paragraph and any ADR that quotes this pair's numbers still need a"
            echo "person to read this diff and decide whether the prose needs updating --"
            echo "see CLAUDE.md's own rule that numbers there stay hand-written."
          } > /tmp/pr-body.md
          gh pr create --title "Refresh the cross-core product stamp ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/pr-body.md --head "$branch" --base main
          {
            echo "### Cross-core product re-take: opened a PR"
            echo
            cat /tmp/product-diff.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### re-take"
            echo "wall time: ${elapsed}s"
          } >> "$GITHUB_STEP_SUMMARY"
