name: nano-tt-area-selfhosted

on:
  workflow_dispatch:
    inputs:
      synth_strategy:
        description: "LibreLane SYNTH_STRATEGY"
        type: choice
        default: "AREA 0"
        options:
          - "AREA 0"
          - "AREA 1"
          - "AREA 2"
          - "AREA 3"
          - "DELAY 0"
          - "DELAY 1"
          - "DELAY 2"
          - "DELAY 3"
          - "DELAY 4"
      tiles:
        description: "info.yaml tile size"
        type: choice
        default: "2x2"
        options:
          - "1x2"
          - "2x2"
          - "3x2"
          - "4x2"
          - "3x4"
          - "6x2"
          - "4x4"
          - "8x2"
      stop_after_synthesis:
        description: "stop at Yosys.Synthesis rather than running the full flow"
        type: boolean
        default: true
      disallow_congestion:
        description: "stop at global routing on any remaining overflow, rather than Tiny Tapeout's own default of routing through it"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nano-tt-area-selfhosted-${{ github.ref }}
  cancel-in-progress: true

env:
  TT_SUPPORT_TOOLS_REF: 01d5d2814fa9dd61e9d211e0b235a4a592a9316a
  PDK_ROOT: /home/runner/pdk
  PDK_CACHE_KEY: nano-tt-area-sky130-pdk-librelane-3.0.5

jobs:
  harden:
    name: harden (little-cpu-runners, no docker)
    runs-on: little-cpu-runners
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # Both the harden step and the summary step need this in the same words, so it is
      # resolved once here rather than each re-deriving it from `inputs.` -- a boolean
      # input reads as the string "false", which `||` treats as unset rather than as no.
      - name: Resolve the stop-after-synthesis mode
        env:
          NANO_TT_STOP_AFTER_SYNTHESIS_INPUT: ${{ inputs.stop_after_synthesis }}
        run: |
          if [ "$NANO_TT_STOP_AFTER_SYNTHESIS_INPUT" = "false" ]; then
            echo "NANO_TT_STOP_AFTER_SYNTHESIS=0" >> "$GITHUB_ENV"
          else
            echo "NANO_TT_STOP_AFTER_SYNTHESIS=1" >> "$GITHUB_ENV"
          fi

      - name: Resolve librelane-env's toolchain
        run: |
          librelane-env python3 -c \
            "import librelane; print('librelane', librelane.__version__)"
          for tool in openroad magic netgen klayout verilator; do
            librelane-env "$tool" --version 2>&1 | head -1
          done

      - name: Checkout tt-support-tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ${{ env.TT_SUPPORT_TOOLS_REF }}
          path: tt

      - name: Restore the sky130 PDK
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PDK_ROOT }}
          key: ${{ env.PDK_CACHE_KEY }}

      - name: Set the requested tile size in info.yaml
        env:
          NANO_TT_TILES: ${{ inputs.tiles || '2x2' }}
        run: |
          python3 - <<'PYEOF'
          import os, re
          tiles = os.environ["NANO_TT_TILES"]
          with open("info.yaml") as f:
              text = f.read()
          text = re.sub(r'tiles: ".*?"', f'tiles: "{tiles}"', text)
          with open("info.yaml", "w") as f:
              f.write(text)
          PYEOF

      - name: Create the LibreLane user config, then set SYNTH_STRATEGY
        env:
          NANO_TT_STRATEGY: ${{ inputs.synth_strategy || 'AREA 0' }}
          NANO_TT_DISALLOW_CONGESTION: ${{ inputs.disallow_congestion && '1' || '0' }}
        run: |
          librelane-env bash -c '
            set -euo pipefail
            for lib in libstdc++.so.6 libexpat.so.1 libcairo.so.2 libz.so.1; do
              found=$(find /nix/store -maxdepth 4 -name "$lib" 2>/dev/null | head -1) || true
              echo "$lib -> $found"
              if [ -n "$found" ]; then export LD_LIBRARY_PATH="$(dirname "$found"):${LD_LIBRARY_PATH:-}"; fi
            done
            python3 -m venv --system-site-packages .venv-tt
            . .venv-tt/bin/activate
            pip install -r tt/requirements.txt
            python3 -c "import librelane; print(librelane.__version__)"
            ./tt/tt_tool.py --create-user-config
          '
          python3 - <<'PYEOF'
          import json, os
          strategy = os.environ["NANO_TT_STRATEGY"]
          with open("src/config_merged.json") as f:
              config = json.load(f)
          config["SYNTH_STRATEGY"] = strategy
          if os.environ["NANO_TT_DISALLOW_CONGESTION"] == "1":
              config["GRT_ALLOW_CONGESTION"] = 0
          with open("src/config_merged.json", "w") as f:
              json.dump(config, f, indent=2)
          PYEOF

      - name: Harden with LibreLane, no Docker
        run: |
          librelane-env bash -c '
            set -euo pipefail
            for lib in libstdc++.so.6 libexpat.so.1 libcairo.so.2 libz.so.1; do
              found=$(find /nix/store -maxdepth 4 -name "$lib" 2>/dev/null | head -1) || true
              if [ -n "$found" ]; then export LD_LIBRARY_PATH="$(dirname "$found"):${LD_LIBRARY_PATH:-}"; fi
            done
            . .venv-tt/bin/activate
            rm -rf runs/wokwi
            mkdir -p runs/wokwi
            harden_cmd=(python -m librelane --pdk-root "$PDK_ROOT" --run-tag wokwi
              --force-run-dir runs/wokwi)
            if [ "$NANO_TT_STOP_AFTER_SYNTHESIS" = "1" ]; then
              harden_cmd+=(--to Yosys.Synthesis)
            fi
            harden_cmd+=(src/config_merged.json)
            if command -v /usr/bin/time >/dev/null 2>&1; then
              rc=0
              /usr/bin/time -v "${harden_cmd[@]}" 2> harden.time.log || rc=$?
              cat harden.time.log
              exit "$rc"
            else
              "${harden_cmd[@]}"
            fi
          '

      # Placed right after the step that resolves the PDK (LibreLane fetches it into
      # PDK_ROOT on demand) rather than at the end of the job: `if: always()` steps still
      # run after this job's timeout cancels it, but the PDK the harden step downloaded
      # is what a re-run should not have to fetch again either way.
      - name: Save the sky130 PDK
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PDK_ROOT }}
          key: ${{ env.PDK_CACHE_KEY }}

      - name: Report peak memory and job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          if [ "$NANO_TT_STOP_AFTER_SYNTHESIS" = "1" ]; then
            stop_after_synthesis_report=true
          else
            stop_after_synthesis_report=false
          fi
          # A step summary is written to $GITHUB_STEP_SUMMARY only, so nothing in it
          # reaches `gh run view --log`; echo each line to stdout too rather than pipe
          # this block through tee, which would hand the step's exit status to tee's.
          summary_line() {
            echo "$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          summary_line "### nano-tt-area harden (self-hosted)"
          summary_line "strategy: ${{ inputs.synth_strategy || 'AREA 0' }}"
          summary_line "tiles: ${{ inputs.tiles || '2x2' }}"
          summary_line "stop after synthesis: $stop_after_synthesis_report"
          summary_line "disallow congestion: ${{ inputs.disallow_congestion || 'false' }}"
          summary_line "wall time: ${elapsed}s"
          if [ -r /sys/fs/cgroup/memory.peak ]; then
            summary_line "cgroup memory.peak: $(cat /sys/fs/cgroup/memory.peak) bytes"
          elif [ -r /sys/fs/cgroup/memory/memory.max_usage_in_bytes ]; then
            summary_line "cgroup memory.max_usage_in_bytes: $(cat /sys/fs/cgroup/memory/memory.max_usage_in_bytes) bytes"
          fi

      # A cancelled or failed run is exactly the case the earlier single-file copy
      # missed reports for, so this walks every step directory rather than naming one.
      - name: Collect the run directory's reports and logs
        if: always()
        run: |
          mkdir -p spike-stats
          cp harden.time.log spike-stats/ 2>/dev/null || true
          cp runs/wokwi/final/metrics.csv spike-stats/ 2>/dev/null || true
          for d in runs/wokwi/*-yosys-synthesis; do
            cp "$d/reports/stat.rpt" spike-stats/synthesis-stats.txt 2>/dev/null || true
          done
          while IFS= read -r -d '' report_dir; do
            dest="spike-stats/${report_dir#runs/wokwi/}"
            mkdir -p "$dest"
            cp -r "$report_dir"/. "$dest"/ 2>/dev/null || true
          done < <(find runs/wokwi -type d -name reports 2>/dev/null -print0)
          while IFS= read -r -d '' log_file; do
            dest="spike-stats/${log_file#runs/wokwi/}"
            mkdir -p "$(dirname "$dest")"
            cp "$log_file" "$dest" 2>/dev/null || true
          done < <(find runs/wokwi -maxdepth 2 -name '*.log' 2>/dev/null -print0)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nano-tt-area-selfhosted-stats
          path: spike-stats/*
          if-no-files-found: warn
