name: nano-tt-area-selfhosted

on:
  workflow_dispatch:
    inputs:
      synth_strategy:
        description: "LibreLane SYNTH_STRATEGY"
        type: choice
        default: "AREA 0"
        options:
          - "AREA 0"
          - "AREA 1"
          - "AREA 2"
          - "AREA 3"
          - "DELAY 0"
          - "DELAY 1"
          - "DELAY 2"
          - "DELAY 3"
          - "DELAY 4"
      tiles:
        description: "info.yaml tile size"
        type: choice
        default: "2x2"
        options:
          - "1x2"
          - "2x2"
          - "3x2"
          - "4x2"
      stop_after_synthesis:
        description: "stop at Yosys.Synthesis rather than running the full flow"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nano-tt-area-selfhosted-${{ github.ref }}
  cancel-in-progress: true

env:
  TT_SUPPORT_TOOLS_REF: 01d5d2814fa9dd61e9d211e0b235a4a592a9316a
  PDK_ROOT: /home/runner/pdk

jobs:
  harden:
    name: harden (little-cpu-runners, no docker)
    runs-on: little-cpu-runners
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Resolve librelane-env's toolchain
        run: |
          librelane-env python3 -c \
            "import librelane; print('librelane', librelane.__version__)"
          for tool in openroad magic netgen klayout verilator; do
            librelane-env "$tool" --version 2>&1 | head -1
          done

      - name: Checkout tt-support-tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ${{ env.TT_SUPPORT_TOOLS_REF }}
          path: tt

      - name: Restore the sky130 PDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PDK_ROOT }}
          key: nano-tt-area-sky130-pdk-librelane-3.0.5

      - name: Set the requested tile size in info.yaml
        env:
          NANO_TT_TILES: ${{ inputs.tiles || '2x2' }}
        run: |
          python3 - <<'PYEOF'
          import os, re
          tiles = os.environ["NANO_TT_TILES"]
          with open("info.yaml") as f:
              text = f.read()
          text = re.sub(r'tiles: ".*?"', f'tiles: "{tiles}"', text)
          with open("info.yaml", "w") as f:
              f.write(text)
          PYEOF

      - name: Create the LibreLane user config, then set SYNTH_STRATEGY
        env:
          NANO_TT_STRATEGY: ${{ inputs.synth_strategy || 'AREA 0' }}
        run: |
          librelane-env bash -c '
            set -euo pipefail
            python3 -m venv --system-site-packages .venv-tt
            . .venv-tt/bin/activate
            pip install -r tt/requirements.txt
            ext=$(find .venv-tt -name "tlcore*.so" | head -1)
            echo "=== ldd $ext ==="
            ldd "$ext" || true
            missing=$(ldd "$ext" 2>/dev/null | awk "/not found/{print \$1}")
            echo "missing: $missing"
            libdirs=""
            for lib in $missing; do
              found=$(find /nix/store -maxdepth 4 -name "$lib" 2>/dev/null | head -1)
              echo "$lib -> $found"
              if [ -n "$found" ]; then libdirs="$libdirs:$(dirname "$found")"; fi
            done
            echo "libdirs=$libdirs"
            if [ -n "$libdirs" ]; then export LD_LIBRARY_PATH="${libdirs#:}:${LD_LIBRARY_PATH:-}"; fi
            python3 -c "import librelane; print(librelane.__version__)"
            ./tt/tt_tool.py --create-user-config
          '
          python3 - <<'PYEOF'
          import json, os
          strategy = os.environ["NANO_TT_STRATEGY"]
          with open("src/config_merged.json") as f:
              config = json.load(f)
          config["SYNTH_STRATEGY"] = strategy
          with open("src/config_merged.json", "w") as f:
              json.dump(config, f, indent=2)
          PYEOF

      - name: Harden with LibreLane, no Docker
        env:
          NANO_TT_STOP_AFTER_SYNTHESIS: ${{ inputs.stop_after_synthesis == false && '0' || '1' }}
        run: |
          librelane-env bash -c '
            set -euo pipefail
            so=$(find /nix/store -maxdepth 3 -path "*-gcc-*-lib/lib/libstdc++.so.6" 2>/dev/null | head -1)
            if [ -n "$so" ]; then export LD_LIBRARY_PATH="$(dirname "$so"):${LD_LIBRARY_PATH:-}"; fi
            . .venv-tt/bin/activate
            rm -rf runs/wokwi
            mkdir -p runs/wokwi
            harden_cmd=(python -m librelane --pdk-root "$PDK_ROOT" --run-tag wokwi
              --force-run-dir runs/wokwi)
            if [ "$NANO_TT_STOP_AFTER_SYNTHESIS" = "1" ]; then
              harden_cmd+=(--to Yosys.Synthesis)
            fi
            harden_cmd+=(src/config_merged.json)
            if command -v /usr/bin/time >/dev/null 2>&1; then
              /usr/bin/time -v "${harden_cmd[@]}" 2> harden.time.log
              cat harden.time.log
            else
              "${harden_cmd[@]}"
            fi
          '

      - name: Report peak memory and job wall time
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_START ))
          {
            echo "### nano-tt-area harden (self-hosted)"
            echo "strategy: ${{ inputs.synth_strategy || 'AREA 0' }}"
            echo "tiles: ${{ inputs.tiles || '2x2' }}"
            echo "stop after synthesis: ${{ inputs.stop_after_synthesis || 'true' }}"
            echo "wall time: ${elapsed}s"
            if [ -r /sys/fs/cgroup/memory.peak ]; then
              echo "cgroup memory.peak: $(cat /sys/fs/cgroup/memory.peak) bytes"
            elif [ -r /sys/fs/cgroup/memory/memory.max_usage_in_bytes ]; then
              echo "cgroup memory.max_usage_in_bytes: $(cat /sys/fs/cgroup/memory/memory.max_usage_in_bytes) bytes"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the stats the local flow is compared against
        if: always()
        run: |
          mkdir -p spike-stats
          cp runs/wokwi/final/metrics.csv spike-stats/ 2>/dev/null || true
          for d in runs/wokwi/*-yosys-synthesis; do
            cp "$d/reports/stat.rpt" spike-stats/synthesis-stats.txt 2>/dev/null || true
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nano-tt-area-selfhosted-stats
          path: spike-stats/*
          if-no-files-found: warn
