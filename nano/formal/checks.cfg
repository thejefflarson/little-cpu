[options]
isa rv32imc
solver btormc

[csrs]
mcycle   inc upcnt
minstret inc upcnt

#omit bus_imem_ch0                [DESIGN] nano/formal/imemcheck.sv holds this against the real fetch bus already
#omit bus_imem_fault_ch0          [DESIGN] the shared mem_valid/mem_ready bus carries no fault line; a trap is decided from the retiring instruction, never from an answer arriving with the address
#omit bus_dmem_ch0                [DESIGN] nano/formal/dmemcheck.sv holds this against the real data bus already
#omit bus_dmem_fault_ch0          [DESIGN] same bus, same absent fault line as bus_imem_fault_ch0
#omit bus_dmem_io_read_ch0        [BLOCKED] needs RISCV_FORMAL_BUS and rvformal_addr_io; nano defines no MMIO region
#omit bus_dmem_io_read_fault_ch0  [DESIGN] the data bus half of bus_dmem_fault_ch0's grounds, and it needs rvformal_addr_io as well
#omit bus_dmem_io_write_ch0       [BLOCKED] needs RISCV_FORMAL_BUS and rvformal_addr_io; nano defines no MMIO region
#omit bus_dmem_io_write_fault_ch0 [DESIGN] the data bus half of bus_dmem_fault_ch0's grounds, and it needs rvformal_addr_io as well
#omit bus_dmem_io_order_ch0       [BLOCKED] on the core, not the memory: one access is outstanding at a time, so there is nothing to order
#omit causal_io_ch0               [BLOCKED] needs rvformal_addr_io; nano defines no MMIO region
#omit causal_mem_ch0              [BLOCKED] no [depth] floor is declared for this family yet
#omit fault_ch0                   [DESIGN] the shared mem_valid/mem_ready bus carries no fault line for this to grade
#omit ill_ch0                     [BLOCKED] no [depth] floor is declared for this family yet
#omit csrc_inc_mcycle_ch0         [BLOCKED] mcycle has no CSR implementation yet -- csrw_mcycle_ch0 is baselined FAIL for the same reason
#omit csrc_inc_minstret_ch0       [BLOCKED] minstret has no CSR implementation yet -- csrw_minstret_ch0 is baselined FAIL for the same reason
#omit csrc_upcnt_mcycle_ch0       [BLOCKED] mcycle has no CSR implementation yet -- csrw_mcycle_ch0 is baselined FAIL for the same reason
#omit csrc_upcnt_minstret_ch0     [BLOCKED] minstret has no CSR implementation yet -- csrw_minstret_ch0 is baselined FAIL for the same reason
#omit cover                       [BLOCKED] no standalone cover harness exists for nano yet

[depth]
#derive F 12  worst-case first retire, swept out of `hang`
#derive G 10  worst-case gap between two retires, swept out of `liveness`
#floor insn   F+2G          one retire, assume(valid) at the check cycle, every assertion about it
#floor csrw   F+2G          insn's shape, over a CSR instruction rather than an ISA-table one
#floor reg    F+G,start+G   two retires: the write is shadowed from the start cycle and read back at the check cycle
#floor pc_fwd F+G,start+G   two retires, the predecessor's pc_wdata shadowed from the start cycle
#floor pc_bwd F+G,start+G   pc_fwd's shape, in the other direction
#floor causal F+G,start+G   two retires: the later reader is found in the window and the writer asserts at the check cycle
#floor liveness F+G,trig+G  the retire assumed at trig and its successor, which has to fall inside the window
#floor unique   F+G,trig+G  liveness's shape: two retires, one window
#floor hang     F+1         the first retire alone, asserted on a registered flag
insn           33
reg      13    24
pc_fwd   13    24
pc_bwd   13    24
liveness 1  13 24
unique   1  13 24
causal   13    24
hang     1     14
csrw           33

[script-sources]
read_verilog -sv @basedir@/../../nano/formal/wrapper.v
read_verilog -sv @basedir@/../../nano/nano.v

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS

[defines liveness]
`define RISCV_FAIRNESS

[defines hang]
`define RISCV_FAIRNESS
