project:
  title:        "nanocpu"
  author:       "Jeff Larson"
  discord:      ""
  description:  "A RISC-V core (nano/nano.v) with a QSPI flash/PSRAM front end, a transmit-only UART and GPIO"
  language:     "SystemVerilog"
  clock_hz:     64000000
  tiles: "4x2"
  top_module:  "tt_um_thejefflarson_nanocpu"
  source_files:
    - "tt_um_thejefflarson_nanocpu.v"
    - "../../bus.v"
    - "../../uart.v"
    - "../../gpio.v"
    - "../../qspi.v"
    - "../../nano.v"

pinout:
  ui[0]: "GPIO in, bit 0"
  ui[1]: "GPIO in, bit 1"
  ui[2]: "GPIO in, bit 2"
  ui[3]: "GPIO in, bit 3"
  ui[4]: "GPIO in, bit 4"
  ui[5]: "GPIO in, bit 5"
  ui[6]: "GPIO in, bit 6"
  ui[7]: "GPIO in, bit 7 / machine external interrupt (MEIP)"

  uo[0]: "UART tx"
  uo[1]: "GPIO out, bit 0"
  uo[2]: "GPIO out, bit 1"
  uo[3]: "GPIO out, bit 2"
  uo[4]: "GPIO out, bit 3"
  uo[5]: "GPIO out, bit 4"
  uo[6]: "GPIO out, bit 5"
  uo[7]: "GPIO out, bit 6"

  uio[0]: "QSPI sck"
  uio[1]: "QSPI flash chip select (active low)"
  uio[2]: "QSPI PSRAM chip select (active low)"
  uio[3]: "QSPI spare chip select (active low, unused)"
  uio[4]: "QSPI sio0"
  uio[5]: "QSPI sio1"
  uio[6]: "QSPI sio2"
  uio[7]: "QSPI sio3"

yaml_version: 6
